<!doctype html>
<html><head><meta charset="utf-8"><title>O Jantar — parte 1</title>
<script type="importmap">{"imports": {"three": "../../engine/vendor/three.module.js"}}</script>
<style>
@font-face { font-family: 'Oswald'; font-weight: 700; src: url('../../engine/vendor/fonts/oswald-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: url('../../engine/vendor/fonts/jetbrains-mono-latin-700-normal.woff2') format('woff2'); }
html, body { margin: 0; background: #000; } canvas { display: block; }
</style>
<script src="timing.js"></script>
</head><body>
<canvas id="film" width="1080" height="1920"></canvas>
<script type="module">
import * as S from '../../engine/stage.js';
import { buildWorld } from '../world.js';
const { THREE, clamp, lerp, ease, spring, box, hud, ruleSticker, endCard, chunkCaptions, drawCaptions, loadFonts, W: CW, H: CH } = S;
S.LABELS.day = ''; S.LABELS.follow = 'SIGA PARA A PARTE ';
const T = window.TIMING;
const w = (li, word, n = 0) => { const b = s => s.toLowerCase().replace(/[^\p{L}0-9:]/gu, ''); let k = 0; for (const x of T.lines[li].words) if (b(x.w) === b(word) && k++ === n) return x.s; throw new Error(`word "${word}" not in line ${li}`); };
const L0 = li => T.lines[li].words[0].s;
const c = document.getElementById('film').getContext('2d');
const stage = S.createStage(document.getElementById('film'));
const Wd = buildWorld(stage);
const { you, gf, mom, dad, grandpa, POSE, at: put, place } = Wd;
const COVER = location.hash === '#cover';
stage.renderer.toneMappingExposure = 1.1;

// the newspaper (grandpa)
const paper = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.42), new THREE.MeshStandardMaterial({ color: '#e8e4d8', emissive: '#e8e4d8', emissiveIntensity: 0.15, side: THREE.DoubleSide })); Wd.bath.add(paper);
const SEAT = -0.16;                           // seated: the standing figure, lowered behind the table
const seats = { dad: [-1.6, 0], you: [0.3, 0.9], gf: [-0.6, 0.9], mom: [0.5, -0.9] };
function dinner(t, { stare = false, talk = 0, dadUp = 0 } = {}) {
  Wd.use('dining'); place('dining', you, gf, mom, dad);
  const face = p => stare ? Object.assign({}, POSE.table, { facing: p }) : POSE.table;
  put(you, seats.you[0], SEAT, seats.you[1], t >= L0(14) ? POSE.clench : POSE.table);
  put(gf, seats.gf[0], SEAT, seats.gf[1], stare ? Object.assign({}, POSE.table, { facing: 1 }) : POSE.table);
  put(mom, seats.mom[0], SEAT, seats.mom[1], stare ? Object.assign({}, POSE.table, { facing: -1, mood: 'scared' }) : POSE.table);
  put(dad, seats.dad[0], SEAT * (1 - dadUp), seats.dad[1], talk ? POSE.tableTalk(t) : (stare ? Object.assign({}, POSE.table, { facing: 1 }) : POSE.table));
  const full = t >= w(5, 'Duas') ? 1.35 : (t >= w(5, 'serve') ? 1.0 : 0.6);
  Wd.plates[1].scale.set(full, 1 + (full - 0.6) * 3, full);
  Wd.potSteam(t, 0);
}

// ---------- the shot list ----------
const SH = [], at = (t0, f) => SH.push([t0, f]);
// 0. the opener: tight on you, the steaming feijoada in front; pull out to the table
at(0, (t, u) => { dinner(t); const k = ease(u / 2.3); stage.aim([lerp(0.15, 0.6, k), lerp(1.15, 1.75, k), lerp(-0.55, -2.4, k)], [lerp(0.3, 0.0, k), lerp(1.0, 0.85, k), lerp(0.9, 0.3, k)], lerp(42, 62, k)); });
// 1. the house at night
at(w(0, 'Primeiro'), (t, u) => { Wd.use('ext'); place('ext'); stage.aim([3 - u, 2.2, 16 - u * 1.5], [0, 3.2, 0], 50); });
// 2. her parents: the father at the head, the mother across
at(w(0, 'pais'), (t, u) => { dinner(t); stage.aim([1.9, 1.45, 2.3 - u * 0.1], [-1.0, 0.95, -0.4], 56); });
// 3. in the car she gave you three rules: she whispers to you
at(L0(1), (t, u) => { dinner(t); put(gf, seats.gf[0] + 0.3, SEAT, seats.gf[1], { facing: 1, lean: 0.25, headTilt: 0.2, armL: [1.2, -1.6], armR: [-0.9, 1.2] }); stage.aim([-0.9, 1.25, 2.4 - u * 0.05], [-0.1, 0.95, 0.9], 46); });
// 4. rule 1: her mother serves
at(L0(2), (t, u) => { dinner(t); put(mom, 0.15, 0, -0.75, { facing: 1, armR: [-1.2, -0.4], armL: [0.3, -0.2] }); stage.aim([0.2, 1.6, 2.2], [0.1, 1.1, -0.6], 56); });
// 5. rule 2: the father, low angle
at(L0(3), (t, u) => { dinner(t); stage.aim([-0.6, 0.85, 0.6 - u * 0.05], [-1.6, 1.05, 0], 50); });
// 6. rule 3: the forbidden door upstairs
at(L0(4), (t, u) => { Wd.use('up'); place('up'); Wd.forbidden.userData.open(0); Wd.forbLight.intensity = 0; Wd.forbGlow.visible = false; stage.aim([0.3, 1.2, 1.6 - u * 0.2], [0.3, 1.2, -2], 58); });
// 7. the feijoada: your plate fills
at(L0(5), (t, u) => { dinner(t); stage.aim([0.32, 1.35, 0.0], [0.3, 0.8, 0.42], 52); });
// 8. twice: your face
at(w(5, 'Duas'), (t, u) => { dinner(t); stage.aim([0.25, 0.95, -0.35], [0.3, 0.88, 0.9], 46); });
// 9. 20:31: your belly rumbles (the camera shakes)
at(L0(6), (t, u) => { dinner(t); const sh = t > w(6, 'barulho') && t < w(6, 'barulho') + 0.5 ? 0.015 * Math.sin(t * 90) : 0; stage.aim([0.4 + sh, 0.75, -0.25], [0.3, 0.62, 0.9], 48); });
// 10. everyone heard it: they all stare at you
at(L0(7), (t, u) => { dinner(t, { stare: true }); stage.aim([0.3, 1.6, -2.6 + u * 0.1], [-0.3, 0.9, 0.5], 64); });
// 11. "was that thunder?"
at(L0(8), (t, u) => { dinner(t, { stare: true }); stage.aim([-0.85, 0.95, -0.25], [-1.6, 1.0, 0], 46); });
// 12. not a cloud in the sky: stars over the house
at(L0(9), (t, u) => { Wd.use('ext'); place('ext'); stage.aim([2, 1.5, 14], [-6, 14 + u, -30], 58); });
// 13. seven metres of intestine (overlay) over your face
at(L0(10), (t, u) => { dinner(t); stage.aim([0.25, 0.95, -0.35 + u * 0.03], [0.3, 0.88, 0.9], 46); });
// 14. her father starts telling how he met his wife
at(L0(11), (t, u) => { dinner(t, { talk: 1 }); stage.aim([0.4, 1.3, -1.6], [-1.3, 1.0, 0.2], 56); });
// 15. since childhood: you, sweating, the clock running
at(L0(12), (t, u) => { dinner(t, { talk: 1 }); stage.aim([0.25, 0.95, -0.35], [0.3, 0.86, 0.9], 44); });
// 16. and nobody stands before him: the whole table
at(L0(13), (t, u) => { dinner(t, { talk: 1 }); stage.aim([2.4, 2.1, 2.4], [-0.2, 0.7, 0], 58); });
// 17. cold sweat, you clench everything (shake)
at(L0(14), (t, u) => { dinner(t, { talk: 1 }); const sh = 0.006 * Math.sin(t * 70); stage.aim([0.3 + sh, 1.0, -0.6], [0.3, 0.8, 0.9], 50); });
// 18. he stands up
at(L0(15), (t, u) => { dinner(t, { dadUp: ease(u / 0.5) }); stage.aim([0.6, 1.2, -1.6], [-1.4, 1.2, 0], 56); });
// 19. you run to the bathroom downstairs
at(w(15, 'Você'), (t, u) => { Wd.use('hall'); place('hall', you); you.walk(u * 2.6, { speed: 2.6, facing: 0 }); you.pose(POSE.hold); you.mesh.position.set(0.3, 0, 0.2 - u * 2.6); stage.aim([-0.5, 1.5, 1.6], [0.6, 1.0, -3.5], 60); });
// 20. locked: the knob rattles
at(L0(16), (t, u) => { Wd.use('hall'); place('hall', you); put(you, 0.6, 0, -3.0, Object.assign({}, POSE.reach, { facing: 1, mood: 'scared' })); Wd.bathDoor.userData.open(0); Wd.bathDoor.rotation.z = 0; const kk = Math.sin(t * 60) * 0.004; stage.aim([0.2 + kk, 1.1, -2.7], [1.15, 1.0, -3.2], 50); });
// 21. through the keyhole: grandpa, reading the paper
at(L0(17), (t, u) => { Wd.use('bath'); place('bath', grandpa); put(grandpa, -0.3, 0.05, -1.0, POSE.read); paper.visible = true; paper.position.set(-0.3, 1.05, -0.78); paper.rotation.set(-0.1, 0, 0); stage.aim([-0.3, 1.0, 0.6], [-0.3, 0.95, -1.0], 40); });
// 22. "about forty minutes, son": the paper drops a little
at(L0(18), (t, u) => { Wd.use('bath'); place('bath', grandpa); put(grandpa, -0.3, 0.05, -1.0, POSE.read); paper.visible = true; const k = ease(u / 0.4); paper.position.set(-0.3, 1.05 - 0.22 * k, -0.78); paper.rotation.set(-0.1 - 0.6 * k, 0, 0); stage.aim([-0.3, 1.05, 0.6], [-0.3, 1.0, -1.0], 40); });
// 23. only the bathroom upstairs is left: you, looking up the stairs
at(L0(19), (t, u) => { Wd.use('hall'); place('hall', you); put(you, -0.55, 0, -5.4, Object.assign({}, POSE.hold, { facing: 0 })); stage.aim([0.3, 0.6, -2.6], [-0.55, 1.9, -8], 60); });
// 24. you climb; every step a battle
at(L0(20), (t, u) => { Wd.use('hall'); place('hall', you); const k = Math.min(5, u * 1.6); put(you, -0.55, 0.18 * (k + 1), -6.3 - 0.28 * k, Object.assign({}, POSE.hold, { facing: 1, legL: [0.6, -1.0], legR: [-0.1, 0.1] })); stage.aim([0.4, 1.0, -4.2], [-0.55, 1.8, -7.5], 60); });
// 25. upstairs your girlfriend grabs your arm
at(L0(21), (t, u) => { Wd.use('up'); place('up', you, gf); put(you, 0.7, 0, -1.0, Object.assign({}, POSE.hold, { facing: -1 })); put(gf, -0.3, 0, -0.9, Object.assign({}, POSE.reach, { facing: 1, mood: 'scared' })); Wd.forbidden.userData.open(0.12); Wd.forbLight.intensity = 3; Wd.forbGlow.visible = true; stage.aim([0.2, 1.4, 1.9 - u * 0.1], [0.2, 1.05, -1.5], 58); });
// 26. "there's something in there my father lets no one see": close on her
at(L0(22), (t, u) => { Wd.use('up'); place('up', you, gf); put(you, 0.7, 0, -1.0, Object.assign({}, POSE.hold, { facing: -1 })); put(gf, -0.3, 0, -0.9, Object.assign({}, POSE.stand, { facing: 1, mood: 'scared' })); Wd.forbidden.userData.open(0.12); Wd.forbLight.intensity = 3; Wd.forbGlow.visible = true; stage.aim([0.25, 1.2, 0.3], [-0.3, 1.1, -0.9], 46); });
// 27. the last image: the door, a line of light, it opens a little more
at(w(22, 'pai'), (t, u) => { Wd.use('up'); place('up'); Wd.forbidden.userData.open(0.12 + 0.18 * ease(u / 1.5)); Wd.forbLight.intensity = 3 + 2 * u; Wd.forbGlow.visible = true; stage.aim([0.9, 1.3, 0.2], [0.3, 1.0, -2], 55); });

// ---------- the overlay ----------
const CLOCK = [[0, '20:14'], [L0(6), '20:31'], [L0(12), '20:44'], [L0(15), '20:48'], [L0(19), '20:50']];
const clockAt = t => ['JANTAR', CLOCK.filter(x => t >= x[0]).pop()[1]];
// the pressure gauge: each value lands on its word
const PK = [[0, 12], [w(5, 'feijoada'), 30], [w(5, 'Duas'), 45], [w(6, 'barulho'), 64], [w(10, '7'), 72], [w(12, 'infância'), 84], [w(14, 'aperta'), 91], [L0(16), 94], [w(18, 'quarenta'), 97], [w(20, 'batalha'), 98], [w(22, 'ver'), 99]];
function pressure(t) { let v = PK[0][1]; for (let i = 1; i < PK.length; i++) { const [tk, vk] = PK[i]; if (t >= tk - 0.35) v = lerp(PK[i - 1][1], vk, ease((t - tk + 0.35) / 0.35)); } return Math.round(v); }
function gauge(c, v, t) {
  const x = 640, y = 120, wd = 400, ht = 108, hot = v >= 90, sh = hot ? Math.sin(t * 50) * 3 : 0;
  c.save(); c.translate(sh, 0); c.fillStyle = 'rgba(8,9,12,0.62)'; c.beginPath(); c.roundRect(x, y, wd, ht, 18); c.fill();
  c.font = '700 30px "JetBrains Mono"'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = '#f3eee4'; c.fillText('PRESSÃO', x + 24, y + 30);
  c.textAlign = 'right'; c.fillStyle = hot ? '#ff5a4f' : '#ffcc4d'; c.font = '700 40px "JetBrains Mono"'; c.fillText(v + '%', x + wd - 22, y + 32);
  c.fillStyle = 'rgba(255,255,255,0.15)'; c.beginPath(); c.roundRect(x + 24, y + 62, wd - 48, 26, 13); c.fill();
  const gr = c.createLinearGradient(x + 24, 0, x + wd - 24, 0); gr.addColorStop(0, '#4fe08a'); gr.addColorStop(0.6, '#ffcc4d'); gr.addColorStop(1, '#ff4b3e');
  c.fillStyle = gr; c.beginPath(); c.roundRect(x + 24, y + 62, (wd - 48) * v / 100, 26, 13); c.fill(); c.restore();
}
// seven metres of intestine: a squiggle drawn across the screen
function gut(c, k) {
  if (k <= 0) return; c.save(); c.globalAlpha = clamp(k * 3);
  c.fillStyle = 'rgba(0,0,0,0.45)'; c.fillRect(0, 380, CW, 820);
  const pts = []; for (let i = 0; i <= 240; i++) { const u = i / 240, row = Math.floor(u * 6), f = (u * 6) % 1; const x = row % 2 ? 900 - f * 720 : 180 + f * 720; pts.push([x, 480 + row * 110 + Math.sin(f * Math.PI * 6) * 18]); }
  const n = Math.floor(pts.length * clamp(k)); c.lineCap = 'round'; c.lineJoin = 'round';
  for (const [col, lw] of [['#15171c', 64], ['#f2a7a0', 40]]) { c.strokeStyle = col; c.lineWidth = lw; c.beginPath(); pts.slice(0, Math.max(2, n)).forEach((p, i) => i ? c.lineTo(...p) : c.moveTo(...p)); c.stroke(); }
  c.font = '700 120px Oswald'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineWidth = 14; c.strokeStyle = '#0b0c0f'; c.strokeText('≈ 7 METROS', 540, 1150); c.fillStyle = '#ffcc4d'; c.fillText('≈ 7 METROS', 540, 1150);
  c.restore();
}
// the keyhole
function keyhole(c) { c.save(); c.fillStyle = '#000'; c.beginPath(); c.rect(0, 0, CW, CH); c.arc(540, 820, 230, 0, Math.PI * 2, true); c.moveTo(440, 960); c.lineTo(640, 960); c.lineTo(600, 1350); c.lineTo(480, 1350); c.closePath(); c.fill('evenodd'); c.restore(); }
function pill(c, s, y) { c.save(); c.font = '700 44px Oswald'; const wd = c.measureText(s).width + 70; c.fillStyle = '#d93b30'; c.beginPath(); c.roundRect(540 - wd / 2, y - 40, wd, 80, 40); c.fill(); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(s, 540, y + 2); c.restore(); }

const tEnd = T.voice_end + 0.3;
const CHUNKS = chunkCaptions(T); window.CHUNKS = CHUNKS;
window.TOTAL = 60;
window.seek = t => {
  if (COVER) return cover();
  paper.visible = false;
  let i = 0; while (i + 1 < SH.length && t >= SH[i + 1][0]) i++;
  SH[i][1](t, t - SH[i][0]);
  stage.draw(t, { vignette: 0.45, bloomStrength: i === 1 || i === 12 ? 0.8 : 0.45 });
  if (i === 21 || i === 22) { c.save(); c.globalAlpha = 1; keyhole(c); c.restore(); }
  if (i === 13) gut(c, (t - L0(10)) / 1.4);
  const [d, k] = clockAt(t); hud(c, d, k); gauge(c, pressure(t), t);
  const R = [[2, 1, ['COMA TUDO']], [3, 2, ['NINGUÉM LEVANTA', 'ANTES DO PAI']], [4, 3, ['NUNCA USE O', 'BANHEIRO DE CIMA']]];
  for (const [li, n, txt] of R) { const s = L0(li), e = T.lines[li].end + 0.25; if (t >= s - 0.05 && t < e) ruleSticker(c, n, txt, spring((t - s + 0.05) * 1.4), 560); }
  if (t >= L0(13) && t < T.lines[13].end + 0.2) ruleSticker(c, 2, ['NINGUÉM LEVANTA', 'ANTES DO PAI'], spring((t - L0(13)) * 1.4), 560);
  if (t >= L0(19) && t < T.lines[19].end + 0.2) ruleSticker(c, 3, ['NUNCA USE O', 'BANHEIRO DE CIMA'], spring((t - L0(19)) * 1.4), 560);
  if (t >= tEnd) endCard(c, tEnd, t, ['VOCÊ', 'ENTRA?'], 'SIM: ENTRO', 'NÃO: AGUENTO', 2);
  else drawCaptions(c, CHUNKS, t);
};
function cover() {
  const tt = L0(17) + 0.5; SH[21][1](tt, 0.5); stage.draw(tt, { vignette: 0.45, bloomStrength: 0.45 }); keyhole(c);
  gauge(c, 98, 0);
  pill(c, 'PRIMEIRO JANTAR', 300);
  c.save(); c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  for (const [s, y, col] of [['O BANHEIRO', 450, '#ffffff'], ['PROIBIDO', 590, '#ff5a4f']]) { c.font = '700 140px Oswald'; c.lineWidth = 16; c.strokeStyle = '#0b0c0f'; c.strokeText(s, 540, y); c.fillStyle = col; c.fillText(s, 540, y); }
  c.restore();
}
await loadFonts();
window.seek(0);
window.READY = true;
</script>
</body></html>
