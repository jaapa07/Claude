  Wd.use('room', 1.45); Wd.rain(t); Wd.drawClock(clockSec ?? (t * 1) % 60, 3, 13); Wd.roomLamp.userData.light.intensity = lamp; Wd.roomLamp.userData.bulb.visible = false;

at(L0(2), (t, u) => { room(t, { refl: REFL_LYING }); place('room', lia); put(lia, 0.2, 0, -0.2, Object.assign({}, POSE.look, { facing: 0 })); stage.aim([1.9 - u * 0.15, 2.2, 2.2], [-1.2, 0.9, -0.2], 68); return { flip: true }; });

at(L0(4), (t, u) => { room(t, { refl: REFL_LYING }); place('room', lia); put(lia, 1.6, 0, 0.3, Object.assign({}, POSE.hand, { armL: [lerp(0.3, 1.6, ease(u / 0.8)), -0.1] })); stage.aim([0.3, 1.1, 1.4], [3.2, 0.55, -0.5], 58); return { flip: true }; });

at(L0(5), (t, u) => { room(t, { refl: REFL_LYING }); place('room', lia); put(lia, 1.6, 0, 0.3, POSE.stand); stage.aim([0.4, 1.1, 1.3], [2.5, 0.6, -0.5], 58); return { flip: true, fx: c => ringHand(c, u / 0.3, true), capY: 1700 }; });

at(L0(6), (t, u) => { room(t); place('room'); stage.aim([-0.5, 1.15, -1.75], [-0.6, 0.55, -2.1], 52);

at(L0(8), (t, u) => { room(t); place('room'); stage.aim([1.4, 1.6, -1.9 + u * 0.15], [1.0, 2.5, -14], 50); return { flip: false, bloom: 0.9 }; });
// 09 the cat on the fire escape, staring in (NOT flipped)
at(L0(9), (t, u) => { room(t); place('room'); stage.aim([1.45, 1.25, -1.6], [1.7, 0.95, -3.05], 46); return { flip: false }; });

at(L0(11), (t, u) => { Wd.use('lobby', 1.4); place('lobby', recep); put(recep, 0.1, 0, -1.6, Object.assign({}, POSE.phone, { facing: 0, mood: undefined })); stage.aim([0.1, 1.3, 0.6 - u * 0.1], [0.1, 1.2, -1.6], 48); return { flip: true }; });

await run({ T, c, stage, SH, E, clockAt, coverAt: L0(15) + 0.6, cover: c => { c.save(); const g = c.createLinearGradient(0, 0, 0, 900); g.addColorStop(0, 'rgba(0,0,0,0.65)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, 1080, 900);
