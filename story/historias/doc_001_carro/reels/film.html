import * as S from '../../../../engine/stage.js';

const CW = 1080, CH = 1920, T = window.TIMING;

const { SH, reset, word, pill } = planos({ stage, Wd, c, CW, CH, T, vertical: true });
// each narration line gets one or two of the documentary's shots (1-based, as in prompts_visuais.txt)
const MAP = [[1, 2], [4], [6, 7], [9, 11], [16, 18], [19, 22], [25, 26], [28, 29], [31, 32], [34, 35]];
const LABEL = ['A IDEIA', 'O DESENHO', 'DESIGN', 'CHASSI', 'O MOTOR', 'OS SISTEMAS', 'A PINTURA', 'O INTERIOR', 'A PARTIDA', 'O SONHO'];
