// fireworks: seeded bursts, sampled by time (additive points)
function fireworks(group, bursts, origin = [0, 0, 0]) {
  const N = 90, R = rng(11), geo = new THREE.BufferGeometry();
  const pos = new Float32Array(bursts.length * N * 3), col = new Float32Array(bursts.length * N * 3);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

      const age = t - b.t, base = new THREE.Color(b.c), k = age < 0 || age > 2.4 ? 0 : (1 - age / 2.4) ** 1.5;
      dirs[i].forEach((d, j) => {
        const r = b.r * (1 - Math.exp(-3 * Math.max(0, age))) * d[3], o = (i * N + j) * 3;
        pos[o] = origin[0] + b.p[0] + d[0] * r; pos[o + 1] = origin[1] + b.p[1] + d[1] * r - 1.2 * Math.max(0, age) ** 2; pos[o + 2] = origin[2] + b.p[2] + d[2] * r;
        col[o] = base.r * k * 2; col[o + 1] = base.g * k * 2; col[o + 2] = base.b * k * 2;

    });
    geo.attributes.position.needsUpdate = true; geo.attributes.color.needsUpdate = true;
  };
}
function burstList(seed, from, to, every, area) {

  for (let t = from; t < to; t += every * (0.6 + 0.8 * R())) out.push({ t, c: cols[Math.floor(R() * cols.length)], r: area.r * (0.7 + 0.5 * R()), p: [lerp(area.x[0], area.x[1], R()), lerp(area.y[0], area.y[1], R()), lerp(area.z[0], area.z[1], R())] });

}
// smoke: soft grey sprites rising from a source, seeded, sampled by time
function smoke(group, n, src, dir, color = '#6d6a66') {
  const R = rng(5), m = [], sp = [];
  for (let i = 0; i < n; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: SOFT, color, transparent: true, depthWrite: false, opacity: 0 }));
    group.add(s); m.push(s); sp.push({ off: R() * 3, dx: R() * 2 - 1, dz: R() * 2 - 1, sz: 0.6 + R() * 0.9 });
  }
  return (t, t0, amount = 1) => m.forEach((s, i) => {

    s.visible = on && t >= t0;

  });
}

const DARK_WIN = mat('#0e1117'), LIT = {};
function towerPower(tw, t, tOffAt, tOnAt, top) {      // windows go dark from the top floor down, and come back the same way
  for (const x of tw.userData.windows) {
    if (!x.on) { continue; }
    const d = (top - x.floor) * 0.045, off = t >= tOffAt + d && !(t >= tOnAt + d * 0.6 && t < tSmoke - 0.4 + d);
    const key = x.mesh.uuid; if (!LIT[key]) LIT[key] = x.mesh.material;
    x.mesh.material = off ? DARK_WIN : LIT[key];
  }
}
