<script type="module">
import * as S from '../engine/stage.js';

const MODE = location.hash.slice(1), COVER = MODE.startsWith('cover');

// the inside of the bathroom door: a knob and an empty lock plate (two screw holes, no latch)
{ const leaf = Wd.bdoor.userData.leaf; const kn = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), new THREE.MeshStandardMaterial({ color: '#c9a35a', metalness: 0.6, roughness: 0.4 })); kn.position.set(0.3, -0.015, -0.05); leaf.add(kn);
  const pc = document.createElement('canvas'); pc.width = 128; pc.height = 256; const g = pc.getContext('2d'); g.fillStyle = '#b9bcc2'; g.fillRect(0, 0, 128, 256); g.fillStyle = '#1a1a1a'; for (const y of [50, 206]) { g.beginPath(); g.arc(64, y, 12, 0, 7); g.fill(); } g.fillStyle = '#6a5a4a'; g.fillRect(44, 100, 40, 56);
  const tx = new THREE.CanvasTexture(pc); tx.colorSpace = THREE.SRGBColorSpace; const plate = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 0.12), new THREE.MeshStandardMaterial({ map: tx, roughness: 0.4, metalness: 0.4 })); plate.rotation.y = Math.PI; plate.position.set(0.3, 0.12, -0.03); leaf.add(plate); Wd.lockPlate = plate; }

  const p = h.clone().addScaledVector(f, dist).addScaledVector(r, -side).add(new THREE.Vector3(0, up, 0)); stage.aim([p.x, p.y, p.z], [h.x + aim[0], h.y + aim[1], h.z + aim[2]], fov); }

  reny.setSock('L', true); reny.setSock('R', t < B.remove + 0.6); }

function carScene(t, { winL = 0, winR = 0, speed = 11 } = {}) { stage.use('car'); Wd.pine.visible = true; Wd.mirror.visible = true; Wd.roadAt(t, speed); Wd.carWindows(winL, winR); Wd.sockFly.visible = false; Wd.stinkAt(t, 0, new THREE.Vector3()); Wd.wheel.rotation.z = 0.05 * Math.sin(t * 0.7); Wd.renyCar.setSock('R', false); Wd.renyCar.setSock('L', true); }
function inCar(t, leoPose, leoFace, renyPose, renyFace, look = [[0, 0], [0, 0]]) {
  const L = Wd.leoCar, R = Wd.renyCar; L.root.position.set(CAR_SEAT.leo[0], 0, CAR_SEAT.leo[1]); L.root.rotation.y = 0; L.root.visible = true; L.pose(carSit(Object.assign({ armL: [1.25, 0.05, 0.35], armR: [1.25, 0.05, 0.35] }, leoPose))); L.expr(leoFace, look[0], blink(t, 2));
  R.root.position.set(CAR_SEAT.reny[0], 0, CAR_SEAT.reny[1]); R.root.rotation.y = 0; R.root.visible = true; R.pose(carSit(renyPose)); R.expr(renyFace, look[1], blink(t, 0), { sweatT: t }); }
const pocketWorld = who => { who.root.updateMatrixWorld(true); return who.legL.hp.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(-0.05, 0.08, 0.12)); };

// ---------------- the shots ----------------
const SH = [], at = (t0, f) => SH.push([t0, f]);
// ===== 1. a noite começa bem =====
at(B.facade, (t, u) => { stage.use('street'); Wd.hideAll(); Wd.walker.root.visible = false; const k = ease(clamp(u / 2.4)); stage.aim([lerp(-2.5, -1.0, k), lerp(1.2, 1.9, k), lerp(14, 10.5, k)], [0, lerp(2.0, 2.7, k), -1.4], 50); });
at(B.inside, (t, u) => { table(t, { mood: 'laugh', k: 0.7 }); renyTable(t, { armR: [0.95 + 0.2 * Math.sin(t * 1.5), 0.15, 1.0] }, FACE.laugh); const k = ease(clamp(u / 1.5)); stage.aim([lerp(2.4, 1.8, k), lerp(2.2, 1.7, k), lerp(3.2, 2.4, k)], [0.55, 0.95, 0.15], 50); });
at(B.clink - 0.7, (t, u) => { table(t); const k = ease(clamp(u / 0.65)); const up = () => ({ armR: [lerp(0.95, 1.45, k), lerp(0.12, -0.32, k), lerp(0.85, 0.15, k)] });
  renyTable(t, up(), FACE.happy); put(dudu, seat.beto[0], seat.beto[1], seat.beto[2], sitPose(up()), FACE.happy); put(leo, seat.carla[0], seat.carla[1], seat.carla[2], sitPose({ armL: [lerp(0.95, 1.45, k), lerp(0.12, -0.32, k), lerp(0.85, 0.15, k)] }), FACE.happy);
  glassInHand(Wd.glasses.hero, reny); glassInHand(Wd.glasses.beto, dudu); const hp = leo.handPos('L'); can.position.set(hp.x, hp.y, hp.z);
  stage.aim([TB[0] + 0.45, 1.5, TB[1] + 1.05], [TB[0], 1.08, TB[1] - 0.1], lerp(50, 42, ease(u / 2))); });
at(B.clink + 0.6, (t, u) => { table(t, { mood: 'laugh' }); const sip = clamp((u - 0.2) / 1.2), up = Math.sin(Math.PI * sip); renyTable(t, { armR: [0.95 + 0.75 * up, 0.15 - 0.45 * up, 0.85 + 1.35 * up], head: [-0.18 * up, 0, 0] }, up > 0.3 ? FACE.bliss : FACE.laugh); glassInHand(Wd.glasses.hero, reny, 'R', -0.05); faceCam(reny, 0.85, 0.25, -0.05, 38, [0, -0.08, 0]); });
at(B.clink + 2.0, (t, u) => { table(t, { mood: 'laugh' }); renyTable(t, {}, FACE.laugh); faceCam(dudu, 0.75, 0.2, 0.05, 40); });
// the belly growls; the smile dies
at(B.growl - 0.05, (t, u) => { table(t, { mood: 'laugh', k: 0.5 }); renyTable(t, { lean: 0.03 * Math.sin(t * 40) * Math.max(0, 1 - u) }, FACE.happy); const s = shake(t, 0.006 * Math.max(0, 1 - u * 0.8)); const h = reny.headPos(); stage.aim([h.x + 0.95 + s[0], h.y - 0.38 + s[1], h.z + 0.35], [h.x, h.y - 0.5, h.z + 0.05], 38); });
at(B.smile, (t, u) => { table(t, { mood: 'laugh', k: 0.4 }); const k = clamp((u - 0.1) / 1.0); const f = k < 0.5 ? mixFace(FACE.happy, FACE.smile, k * 2) : mixFace(FACE.smile, FACE.worried, (k - 0.5) * 2); renyTable(t, {}, f);
  const d = lerp(1.35, 0.72, ease(clamp(u / 1.1))), fov = lerp(24, 44, ease(clamp(u / 1.1))); const h = reny.headPos(); stage.aim([h.x, h.y + 0.02, h.z + d], [h.x, h.y - 0.03, h.z], fov); });
at(L0(0) - 0.1, (t, u) => { table(t, { mood: 'chat' }); renyTable(t, { armL: [0.5, 0.0, 1.4], lean: 0.08 }, w(0, 'agora') <= t ? FACE.panic : FACE.worried, [0, 0], { sweatT: t }); faceCam(reny, 0.95, 0.15, -0.05, 40, [0, -0.15, 0]); });
at(L0(1) - 0.1, (t, u) => { table(t); renyTable(t, { armL: [0.5, 0.0, 1.4] }, FACE.panic, [0, 0], { sweatT: t }); put(dudu, seat.beto[0], seat.beto[1], seat.beto[2], sitPose({ armR: [2.6, 0.2, 0.3], lean: -0.05 }), FACE.happy, [0.6, 0]); glassInHand(Wd.glasses.beto, dudu); faceCam(dudu, 0.75, -0.25, 0.05, 40); });

  else { const v = clamp((u - 0.5) / 1.2); stiffWalk(reny, lerp(TB[0] + 0.2, 3.4, v), lerp(TB[1] - 0.8, -4.4, v), 2.5, t, FACE.panic); }
  stage.aim([TB[0] - 1.2, 1.5, TB[1] + 1.4], [lerp(TB[0], 2.8, ease(clamp(u / 1.7))), 1.0, lerp(TB[1] - 0.6, -3.5, ease(clamp(u / 1.7)))], 50); });
// ===== 2. banheiro sem segurança =====
at(B.enter, (t, u) => { bath(t, { door: 1.2 * (1 - ease(clamp((u - 0.4) / 0.35))) }); const k = ease(clamp(u / 0.6)); put(reny, lerp(2.95, 2.35, k), lerp(-10.0, -10.05, k), -Math.PI / 2, { armR: [1.3, 0.2, 0.2], lean: 0.1 }, FACE.panic, [0, 0], 0, { sweatT: t }); stage.aim([1.3, 1.45, -10.6], [2.6, 1.15, -9.95], 56); });

at(L0(2) + 0.3, (t, u) => { bath(t, { door: 0.12 }); put(reny, ...TOILET, onToilet(holdDoor(t)), FACE.worried, [0.5, 0], blink(t, 0), { sweatT: t }); const h = reny.headPos(); stage.aim([h.x + 0.75, h.y + 0.05, h.z - 0.75], [h.x + 0.1, h.y - 0.12, h.z], 44); });

at(B.queue, (t, u) => { bath(t, { door: 0.12, queue: 1 + Math.min(2, Math.floor(u / 0.55)) }); stage.aim([4.35, 1.6, -6.6], [3.1, 1.2, -9.6], 52); });                 // outside: the queue grows
at(B.knock1, (t, u) => { bath(t, { door: 0.1, queue: 3 }); const k = Math.sin(clamp(u / 0.5) * Math.PI * 3) * 0.3; put(lady, 3.4, -9.6, -Math.PI / 2 - 0.2, { armR: [1.3, 0.1, 1.4 + k] }, FACE.worried, [0, 0], blink(t, 7)); stage.aim([4.4, 1.5, -10.6], [3.0, 1.35, -9.7], 50); });

  let x = 540 - tot / 2; parts.forEach((p, i) => { txt(p.s, x + ws[i] / 2, y, '700 80px Oswald', p.key ? (p.color || '#ffcc4d') : '#ffffff', { stroke: 14 }); x += ws[i] + sp; }); c.restore(); }

window.PARTS = PARTS.map(p => ({ at: p.at, end: p.end }));
function endCard(k) { const P = PARTS[k]; window.seek(P.end - 0.05); c.save(); c.fillStyle = 'rgba(6,7,10,0.75)'; c.fillRect(0, 0, 1080, 1920);
  P.q.forEach((s, i) => txt(s, 540, 760 + i * 130, '700 130px Oswald', i ? '#ffcc4d' : '#ffffff', { stroke: 14 }));
  c.fillStyle = '#d93b30'; c.beginPath(); c.roundRect(190, 1080, 700, 130, 65); c.fill(); txt(`PARTE ${k + 2} NO PERFIL →`, 540, 1146, '700 64px Oswald', '#fff');
  txt('COMENTE O QUE VOCÊ FARIA', 540, 1300, '700 50px Oswald', '#ffffff', { stroke: 8 }); c.restore(); }
function cover() {
  const full = MODE === 'cover'; const k = full ? 0 : Number(MODE.slice(5)) - 1; const P = full ? { shot: L0(0) + 1.5, cam: () => faceCam(reny, 0.9, 0.1, 0.0, 44, [0, -0.3, 0]), pill: 'UMA COMÉDIA EM 3D', title: ['A MEIA', 'DO RENY'] } : PARTS[k];
  const tt = P.shot; let i = 0; while (i + 1 < SH.length && tt >= SH[i + 1][0]) i++; SH[i][1](tt, tt - SH[i][0]); if (P.cam) P.cam(); clearView();
  stage.draw(tt, { vignette: 0.45, bloomStrength: 0.35 });
  c.save(); c.font = '700 44px Oswald'; const wd = c.measureText(P.pill).width + 70; c.fillStyle = '#d93b30'; c.beginPath(); c.roundRect(540 - wd / 2, 1180, wd, 80, 40); c.fill(); txt(P.pill, 540, 1222, '700 44px Oswald', '#fff'); c.restore();
  for (const [s, y, col] of [[P.title[0], 1380, '#ffffff'], [P.title[1], 1520, '#ffcc4d']]) { let fs = 150; c.font = `700 ${fs}px Oswald`; while (c.measureText(s).width > 960 && fs > 60) { fs -= 6; c.font = `700 ${fs}px Oswald`; } txt(s, 540, y, `700 ${fs}px Oswald`, col, { stroke: 18 }); }
}

// ---------------- render ----------------
function clearView() {
  const cp = stage.camera.position; if (Wd.wallN) { Wd.wallN.visible = cp.z < -9.0; Wd.wallS.visible = cp.z > -11.0; Wd.wallW.visible = cp.x > 1.0; }
  const all = [...Wd.people, Wd.walker];
  for (const p of all) if (p.root.visible && p.root.parent && p.root.parent.visible) { const r = p.root.position; if (p.root.parent === Wd.sets.bar && Math.hypot(cp.x - r.x, cp.z - r.z) < 0.42 && cp.y < 2.0) p.root.visible = false; }
  const dir = new THREE.Vector3(); stage.camera.getWorldDirection(dir); const heads = Wd.people.filter(p => p.root.visible && p.root.parent && p.root.parent.visible);
  const front = heads.map(p => ({ p, d: p.headPos().sub(cp) })).filter(o => o.d.dot(dir) > 0).sort((a, b) => a.d.length() - b.d.length());
  const target = front.find(o => o.d.clone().normalize().dot(dir) > 0.985 && o.d.length() < 1.9);
  if (target) for (const o of front) { if (o === target || o.d.length() >= target.d.length()) continue; const r = o.p.root.position, along = new THREE.Vector3(r.x - cp.x, 0, r.z - cp.z), dh = new THREE.Vector3(dir.x, 0, dir.z).normalize(); const perp = along.clone().sub(dh.clone().multiplyScalar(along.dot(dh))).length(); if (perp < 0.4) o.p.root.visible = false; }
}
window.seek = t => {
  if (COVER) return cover();
  if ((MODE === 'end1' || MODE === 'end2') && !window._inEnd) { window._inEnd = true; endCard(Number(MODE.slice(3)) - 1); window._inEnd = false; return; }
  Wd.sockFly.scale.setScalar(1); Wd.carBody.visible = true; Wd.ze.root.visible = false;
  let i = 0; while (i + 1 < SH.length && t >= SH[i + 1][0]) i++;
  SH[i][1](t, t - SH[i][0]); Wd.ze.root.visible = false; clearView();
  const inBath = t >= B.enter && t < B.sit; if (t < B.foot) Wd.footLight.intensity = 0;
  stage.draw(t, { vignette: inBath ? 0.55 : 0.42, bloomStrength: t >= B.car ? 0.6 : 0.35 });
  if (t >= B.growl && t < B.growl + 0.75) bang('RONC!', (t - B.growl) / 0.75 * 1.2, { y: 620, col: '#ff8a3d', size: 210 });
  if (t >= B.creak && t < B.creak + 1.4) bang('NHÉÉÉC', (t - B.creak) * 1.2, { y: 520, col: '#ffffff', size: 140, rot: 0.05 });
  if (t >= B.knock1 && t < B.knock1 + 0.7) bang('TOC TOC TOC', (t - B.knock1) * 2, { y: 470, col: '#ffcc4d', size: 120 });
  if (t >= B.knock2 && t < B.knock2 + 0.8) bang('TOC TOC!', (t - B.knock2) * 2, { y: 470, col: '#ff5a4f', size: 160 });
  if (t >= B.holder + 0.5 && t < B.zoom) bang('VAZIO.', (t - B.holder - 0.5) * 2, { y: 470, col: '#ff5a4f', size: 150, rot: 0 });
  if (t >= B.laugh && t < B.laugh + 1.0) bang('KKKKKK', (t - B.laugh) * 1.6, { y: 520, col: '#4fe08a', size: 170 });
  if (t >= B.sniff && t < B.sniff + 1.2) bang('*FUNGA FUNGA*', (t - B.sniff) * 1.6, { y: 470, col: '#ffffff', size: 90, rot: 0 });
  captions(t); endText(t);
};
await loadFonts();
window.seek(0);
window.READY = true;
</script>
