<!doctype html>
<html><head><meta charset="utf-8"><title>O Templo de 1592 — parte 1</title>
<script type="importmap">{"imports": {"three": "../../engine/vendor/three.module.js"}}</script>
<style>
@font-face { font-family: 'Oswald'; font-weight: 700; src: url('../../engine/vendor/fonts/oswald-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: url('../../engine/vendor/fonts/jetbrains-mono-latin-700-normal.woff2') format('woff2'); }
html, body { margin: 0; background: #000; } canvas { display: block; }

</head><body>
<canvas id="film" width="1080" height="1920"></canvas>
<script type="module">
import * as S from '../../engine/stage.js';
import { buildWorld, flame, smoke, canvasTex } from '../world.js';
const { THREE, clamp, lerp, ease, spring, box, hud, ruleSticker, endCard, chunkCaptions, drawCaptions, loadFonts, W: CW, H: CH } = S;
S.LABELS.day = ''; S.LABELS.follow = 'SIGA PARA A PARTE ';
const T = window.TIMING;
const w = (li, word, n = 0) => { const b = s => s.toLowerCase().replace(/[^\p{L}0-9:]/gu, ''); let k = 0; for (const x of T.lines[li].words) if (b(x.w) === b(word) && k++ === n) return x.s; throw new Error(`word "${word}" not in line ${li}`); };
const L0 = li => T.lines[li].words[0].s;
const c = document.getElementById('film').getContext('2d');
const stage = S.createStage(document.getElementById('film'));
const Wd = buildWorld(stage);
const { monk, master, woman, POSE, heroAt, place } = Wd;
const COVER = location.hash === '#cover';

// ---------- props for this part ----------
const sealC = canvasTex(128, 128); { const g = sealC.g; g.fillStyle = '#6b3a20'; g.fillRect(0, 0, 128, 128); g.fillStyle = '#c4231c'; g.fillRect(34, 34, 60, 60); g.strokeStyle = '#f0d9b0'; g.lineWidth = 5; g.strokeRect(42, 42, 44, 44); g.beginPath(); g.moveTo(64, 46); g.lineTo(64, 82); g.moveTo(48, 64); g.lineTo(80, 64); g.stroke(); }
function chest() { const g = new THREE.Group(); g.add(box(0.6, 0.36, 0.4, '#6b3a20', 0, 0, 0)); const lid = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.06, 0.42), new THREE.MeshStandardMaterial({ map: sealC.tx, roughness: 0.8 })); lid.position.y = 0.39; g.add(lid); g.add(box(0.64, 0.04, 0.05, '#b08d57', 0, 0.2, 0.2)); return g; }
const chestCourt = chest(); Wd.court.add(chestCourt);
// far fires on the horizon (the war)
const warFires = Array.from({ length: 6 }, () => flame(Wd.mount, 9, 0, 1));
const warSmoke = smoke(Wd.mount, 24, [60, 0, -160], [0.6, 6, 0], '#3a2b26', 6, 2.5);

// ---------- key times ----------
const tNight = L0(7), tCandle = w(7, 'apaga'), tOpen = L0(14), tEnd = T.voice_end + 0.3;
const knocks = [L0(10), L0(10) + 0.3, L0(10) + 0.6];

function court(t, { gate = 0, gateShake = 0, torchesOut = 0, sky = null } = {}) {
  const night = t >= tNight;
  Wd.use('court', sky || (night ? 'night' : 'dusk')); stage.renderer.toneMappingExposure = night ? 1.9 : 1.0;
  Wd.courtL.h.intensity = night ? 1.25 : 1.1; Wd.courtL.h.color.set(night ? '#6e86c4' : '#c99a86'); Wd.courtL.d.intensity = night ? 0.9 : 1.0; Wd.courtL.d.color.set(night ? '#9fb4ff' : '#ffb27a');
  Wd.moonSpot.intensity = night ? 1.1 : 1.2; Wd.moonSpot.color.set(night ? '#a9bcff' : '#ffb27a');
  Wd.hallLamp.userData.light.intensity = t < tCandle ? 3 : 0;
  Wd.openGate(gate); Wd.court.children.forEach(() => {});
  if (gateShake) Wd.openGate(gate + gateShake);
  Wd.gateTorches.forEach((f, i) => f.set([-3 + i * 1.2 + Math.sin(i * 3) * 0.4, 1.9, 8.5 + (i % 3) * 1.3], t, torchesOut));
  Wd.trailTorches.forEach(f => f.set([0, -50, 0], t, 0)); Wd.courtFires.forEach(f => f.set([0, -50, 0], t, 0)); Wd.courtSmoke(t, 0);
  Wd.striker.position.x = -1.65; Wd.bellG.rotation.z = 0;
  chestCourt.visible = false;
}
function inner(t, { candles = 1 } = {}) {
  Wd.use('inner', 'night'); stage.renderer.toneMappingExposure = 1.15;
  Wd.candles.forEach((k, i) => k.f.set([k.x, 1.2, -2.0], t, candles >= 1 ? 1 : (i < 3 ? 0 : candles)));
  Wd.incense(t, candles > 0 ? 1 : 0);
}
function mount(t, { trail = 0, n = 36, fires = 0, sky = null, back = false } = {}) {
  Wd.use('mount', sky || (t >= tNight ? 'night' : 'dusk')); stage.renderer.toneMappingExposure = t >= tNight ? 2.4 : 1.1;
  Wd.mountL.h.intensity = t >= tNight ? 0.9 : 1.3;
  Wd.setTrail(t, trail, n);
  Wd.miniFront.material.emissiveIntensity = t < tCandle ? 0.6 : 0;
  Wd.vilWins.forEach(f => f.material.emissiveIntensity = 0);
  warFires.forEach((f, i) => f.set([40 + i * 14, 2 + (i % 2) * 4, -150 - i * 8], t, fires));
  warSmoke(t, fires);
}

// ---------- the shot list ----------
const SH = [], at = (t0, f) => SH.push([t0, f]);
// 0. the opener: you, sweeping the courtyard at dusk; behind you the gate, and far below, torches
at(0, (t, u) => { court(t, { gate: 1.2 }); place('court', monk); heroAt(monk, 0.9, 0, 3.4, { facing: 1, lean: 0.25, armL: [1.0, -0.5], armR: [0.6, -0.3] });
  const k = ease(u / 2.4); stage.aim([lerp(1.9, 3.6, k), lerp(1.3, 2.6, k), lerp(4.6, 9.5, k)], [lerp(0.9, 0.4, k), lerp(1.0, 1.5, k), lerp(3.4, -2, k)], lerp(46, 62, k)); });
// 1. a monk of 16: you bow before the hall
at(w(0, 'Você'), (t, u) => { court(t, { gate: 1.2 }); place('court', monk); heroAt(monk, 0.4, 0, 0.6, POSE.bow); stage.aim([2.6 - u * 0.2, 1.3, 3.6], [0.2, 1.1, -1.0], 58); });
// 2. hidden at the top of the mountain
at(L0(1), (t, u) => { mount(t); place('mount'); const k = ease(u / 2.5); stage.aim([lerp(-30, -12, k), lerp(22, 34, k), lerp(20, -18, k)], [0, lerp(30, 32, k), -40], 50); });
// 3. 1592: Japan invades; fires on the horizon
at(L0(2), (t, u) => { mount(t, { fires: 1 }); stage.aim([-12, 40 + u * 0.3, -18], [70, 2, -155], 50); });
// 4. your master leaves you three rules (inside the hall, candles)
at(L0(3), (t, u) => { inner(t); place('inner', monk, master); heroAt(master, -0.9, 0, -0.6, { facing: 1, armR: [0.9, -1.2] }); heroAt(monk, 0.8, 0, 0.2, Object.assign({}, POSE.bow, { facing: -1 })); stage.aim([2.6 - u * 0.1, 1.7, 3.2], [0, 1.2, -1.5], 62); });
// 5. rule 1: the candles
at(L0(4), (t, u) => { inner(t); place('inner'); stage.aim([0.2, 1.4, -0.6 + u * 0.08], [0, 1.15, -2.0], 52); });
// 6. rule 2: the bell
at(L0(5), (t, u) => { court(t); place('court'); stage.aim([3.4, 1.3, 4.6 - u * 0.1], [5.5, 2.4, 1.5], 56); });
// 7. rule 3: the gate, low angle
at(L0(6), (t, u) => { court(t); place('court'); stage.aim([0.6, 1.0, 1.4 - u * 0.15], [0, 1.9, 6], 64); });
// 8. night falls
at(L0(7), (t, u) => { court(t); place('court', monk); heroAt(monk, -2.2, 0, 1.6, POSE.stand); stage.aim([2 - u * 0.2, 4.5, 5.0], [-1, 1.0, -3], 62); });
// 9. you blow out the last candle
at(tCandle, (t, u) => { inner(t, { candles: 1 - ease(u / 0.35) }); place('inner', monk); heroAt(monk, 0.75, 0, -1.55, Object.assign({}, POSE.reach, { facing: -1, lean: 0.3 })); stage.aim([1.5, 1.25, -0.3], [0.5, 1.1, -2.0], 54); });
// 10. then you see it: you on the wall, looking out
at(L0(8), (t, u) => { court(t, { torchesOut: 0 }); place('court', monk); heroAt(monk, 3.0, 0.9, 5.4, Object.assign({}, POSE.look, { facing: 1 })); stage.aim([1.0, 2.2, 3.0], [3.2, 1.8, 7], 58); });
// 11. torches climbing the trail
at(w(8, 'Tochas'), (t, u) => { mount(t, { trail: 0.35 + 0.06 * u, n: 30 }); stage.aim([55 - u, 22, 4], [0, 14, -40], 42); });
// 12. dozens of them
at(L0(9), (t, u) => { mount(t, { trail: 0.45 + 0.05 * u, n: 36 }); stage.aim([32, 12 - u * 0.5, -8], [8, 9, -32], 34); });
// 13. knocks on the gate
at(L0(10), (t, u) => { const kk = knocks.some(k => t >= k && t < k + 0.1); court(t, { gateShake: kk ? 0.02 : 0, torchesOut: 0.6 }); place('court'); stage.aim([0.3 + (kk ? 0.01 : 0), 0.6, 3.2], [0, 1.6, 6], 60); });
// 14. her voice: you, ear to the gate
at(L0(11), (t, u) => { court(t, { torchesOut: 0.6 }); place('court', monk); heroAt(monk, -0.5, 0, 5.6, Object.assign({}, POSE.look, { facing: -1, lean: 0.15 })); stage.aim([1.8, 1.4, 3.6 - u * 0.1], [-0.4, 1.2, 6], 56); });
// 15. through the crack: a wounded woman holding a chest
at(L0(12), (t, u) => { court(t, { gate: 0.06, torchesOut: 0.8 }); place('court', woman); heroAt(woman, 0.1, 0, 8.0 - u * 0.1, Object.assign({}, POSE.carry, { facing: 0, mood: 'scared' })); chestCourt.visible = true; chestCourt.position.set(0.1, 0.55, 8.15 - u * 0.1); stage.aim([0, 1.25, 5.7], [0.05, 1.0, 9], 56); });
// 16. opening breaks the rule: your hand on the bar
at(L0(13), (t, u) => { court(t, { torchesOut: 0.8 }); place('court', monk); heroAt(monk, -0.3, 0, 5.4, Object.assign({}, POSE.reach, { facing: -1 })); stage.aim([0.9, 1.3, 4.3], [-0.1, 1.15, 6], 54); });
// 17. not opening: the torches, near the top
at(w(13, 'Não'), (t, u) => { mount(t, { trail: 0.72 + 0.03 * u }); stage.aim([24, 34, -16], [4, 26, -36], 44); });
// 18. you open the gate
at(tOpen, (t, u) => { court(t, { gate: 1.1 * ease(u / 0.7), torchesOut: 0.5 }); place('court', monk, woman); heroAt(monk, -1.0, 0, 5.2, Object.assign({}, POSE.stand, { facing: 1 })); heroAt(woman, 0.3, 0, 7.4 - 1.2 * ease(u / 1), Object.assign({}, POSE.carry, { facing: 0, mood: 'scared' })); chestCourt.visible = true; chestCourt.position.set(0.3, 0.55, 7.55 - 1.2 * ease(u / 1)); stage.aim([2.6, 1.6, 2.2], [0, 1.2, 6.5], 60); });
// 19. the king's seal on the chest (macro)
at(L0(15), (t, u) => { court(t, { gate: 1.1, torchesOut: 0.5 }); place('court'); chestCourt.visible = true; chestCourt.position.set(0.2, 0, 4.4); stage.aim([0.55, 0.95 - u * 0.03, 4.75], [0.2, 0.4, 4.4], 50); });
// 20. "the kingdom's records": the two of you by the chest
at(L0(16), (t, u) => { court(t, { gate: 1.1, torchesOut: 0.5 }); place('court', monk, woman); heroAt(woman, 0.6, 0, 4.4, Object.assign({}, POSE.kneel, { facing: -1 })); heroAt(monk, -0.6, 0, 4.2, Object.assign({}, POSE.stand, { facing: 1, mood: 'scared' })); chestCourt.visible = true; chestCourt.position.set(0.1, 0, 4.4); stage.aim([0.2, 1.3, 1.7 + u * 0.05], [0.0, 0.8, 4.6], 58); });
// 21. false relief: the torches turn away
at(L0(17), (t, u) => { mount(t, { trail: 0.75 - 0.12 * ease(u / 2) }); stage.aim([60, 24, 10], [0, 16, -40], 40); });
// 22. and come back, closer: right outside the wall
at(L0(18), (t, u) => { court(t, { gate: 0, torchesOut: 1 }); place('court', monk); heroAt(monk, -2.4, 1.0, 5.6, Object.assign({}, POSE.scared, { facing: 0 })); stage.aim([-3.4, 2.5, 3.0], [-1.5, 1.5, 9], 60); });
// 23. "your master went to gather the warrior monks": close on her
at(L0(19), (t, u) => { court(t, { torchesOut: 1 }); place('court', woman); heroAt(woman, 0.6, 0, 4.4, Object.assign({}, POSE.kneel, { facing: -1, headTilt: -0.2 })); chestCourt.visible = true; chestCourt.position.set(0.1, 0, 4.4); stage.aim([1.5, 1.0, 3.2 - u * 0.05], [0.6, 0.9, 4.4], 48); });
// 24. the signal is the bell: low angle, the moon
at(L0(20), (t, u) => { court(t, { torchesOut: 1 }); place('court'); stage.aim([4.6, 0.8, 3.4], [5.6, 3.3, 1.2], 60 - u * 3); });
// 25. ringing calls the monks: you take the striker rope
at(L0(21), (t, u) => { court(t, { torchesOut: 1 }); place('court', monk); heroAt(monk, 3.2, 0.4, 1.5, POSE.strike(0)); stage.aim([2.4, 1.8, 5.6], [4.4, 1.8, 1.5], 56); });
// 26. ...and shows the temple to the torches
at(w(21, 'E'), (t, u) => { mount(t, { trail: 0.82 + 0.02 * u }); stage.aim([22, 37, -18], [2, 29, -38], 45); });
// 27. "Toca, menino": your face
at(L0(22), (t, u) => { court(t, { torchesOut: 1 }); place('court', monk); heroAt(monk, 3.2, 0.4, 1.5, Object.assign({}, POSE.strike(0), { mood: 'scared' })); stage.aim([3.9, 1.35, 2.6 - u * 0.05], [3.2, 1.15, 1.5], 46); });
// 28. the last image: you and the bell, torchlight beyond the wall
at(w(22, 'Ou'), (t, u) => { court(t, { torchesOut: 1 }); place('court', monk); heroAt(monk, 3.2, 0.4, 1.5, POSE.strike(0)); stage.aim([7.4 - u * 0.2, 1.8, 4.8], [4.6, 2.0, 1.2], 56); });

function clockAt(t) { return ['ANO 1592', t < tNight ? '18:40' : (t < L0(10) ? '21:10' : (t < L0(17) ? '23:50' : '00:20'))]; }
// the crack in the gate: black on both sides of a vertical slit
function crack(c) { c.save(); c.fillStyle = '#000'; c.fillRect(0, 0, 330, CH); c.fillRect(750, 0, 330, CH); const g1 = c.createLinearGradient(330, 0, 430, 0); g1.addColorStop(0, 'rgba(0,0,0,1)'); g1.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g1; c.fillRect(330, 0, 100, CH); const g2 = c.createLinearGradient(650, 0, 750, 0); g2.addColorStop(0, 'rgba(0,0,0,0)'); g2.addColorStop(1, 'rgba(0,0,0,1)'); c.fillStyle = g2; c.fillRect(650, 0, 100, CH); c.restore(); }
function pill(c, s, y) { c.save(); c.font = '700 44px Oswald'; const wd = c.measureText(s).width + 70; c.fillStyle = '#d93b30'; c.beginPath(); c.roundRect(540 - wd / 2, y - 40, wd, 80, 40); c.fill(); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(s, 540, y + 2); c.restore(); }

const CHUNKS = chunkCaptions(T); window.CHUNKS = CHUNKS;
window.TOTAL = 61;
window.seek = t => {
  if (COVER) return cover();
  let i = 0; while (i + 1 < SH.length && t >= SH[i + 1][0]) i++;
  SH[i][1](t, t - SH[i][0]);
  stage.draw(t, { vignette: 0.5, bloomStrength: [2, 3, 11, 12, 17, 21, 26].includes(i) ? 0.85 : 0.55 });
  if (i === 15) crack(c);
  const [d, k] = clockAt(t); hud(c, d, k);
  const R = [[4, 1, ['NENHUMA LUZ', 'APÓS O SOL']], [5, 2, ['O SINO SÓ', 'AO AMANHECER']], [6, 3, ['O PORTÃO', 'NÃO ABRE']]];
  for (const [li, n, txt] of R) { const s = L0(li), e = T.lines[li].end + 0.25; if (t >= s - 0.05 && t < e) ruleSticker(c, n, txt, spring((t - s + 0.05) * 1.4), 560); }
  if (t >= tOpen && t < tOpen + 1.0) { ruleSticker(c, 3, ['O PORTÃO', 'NÃO ABRE'], 1, 560); c.save(); c.translate(540, 560); c.rotate(-0.06); c.strokeStyle = '#d93b30'; c.lineWidth = 22; c.lineCap = 'round'; c.beginPath(); c.moveTo(-360, 60); c.lineTo(-360 + 720 * ease((t - tOpen) / 0.3), -40); c.stroke(); c.restore(); }
  if (t >= tEnd) endCard(c, tEnd, t, ['VOCÊ TOCA', 'O SINO?'], 'SIM: TOCO AGORA', 'NÃO: ESPERO O DIA', 2);
  else drawCaptions(c, CHUNKS, t);
};
function cover() {
  const tt = w(22, 'Ou') + 0.5; SH[28][1](tt, 0.5); stage.draw(tt, { vignette: 0.5, bloomStrength: 0.7 });
  { const gr = c.createLinearGradient(0, 0, 0, 900); gr.addColorStop(0, 'rgba(0,0,0,0.6)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = gr; c.fillRect(0, 0, CW, 900); }
  pill(c, 'COREIA, 1592', 300);
  c.save(); c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  for (const [s, y, col] of [['O SINO', 450, '#ffffff'], ['PROIBIDO', 590, '#ff5a4f']]) { c.font = '700 150px Oswald'; c.lineWidth = 16; c.strokeStyle = '#0b0c0f'; c.strokeText(s, 540, y); c.fillStyle = col; c.fillText(s, 540, y); }
  c.restore();
}
await loadFonts();
window.seek(0);
window.READY = true;
</script>
