<script src="scene6.js"></script>
<script>
'use strict';
const CHAPTER = { number: 1, title: 'Põe na Conta do Cavalo', minutes: 2, language: 'pt', film: true };
try { if (localStorage.getItem('captions') === null) setCaptions(true, false); } catch {}
const BEATS = [
  ['scene1', 'O banheiro', (m, D) => scene1(panel(0), D, m), { lead: false, pre: PRE1 }],
  ['scene2', 'O plano', (m, D) => scene2(panel(0), D, m), { lead: false, pre: PRE2 }],
  ['scene3', 'Dona Neide', (m, D) => scene3(panel(0), D, m), { lead: false, pre: PRE3 }],
  ['scene4', 'O óleo do pastel', (m, D) => scene4(panel(0), D, m), { lead: false, pre: PRE4 }],
  ['scene5', 'A fiscal', (m, D) => scene5(panel(0), D, m), { lead: false, pre: PRE5 }],
  ['scene6', 'A conta', (m, D) => scene6(panel(0), D, m), { lead: false, pre: PRE6 }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
music('audio/sfx/samba.mp3', undefined, .22);
paperWarm(g => { zePuppet(g); valdirPuppet(g); neidePuppet(g); horsePuppet(g); });
boot();
</script>
