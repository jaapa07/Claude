  Wd.use('street'); Wd.setSun(day, elev); you.mesh.castShadow = youShadow; roll.visible = false; flat.visible = false; Wd.bus.visible = false; Wd.shop.visible = true;

  put(you, -1.3, 0.55, -1.05, { facing: 1, lean: -1.45, armL: [0.2, -0.2], armR: [0.1, -0.1] }); const k = ease(u / 1.8); put(shadow, 1.2, 0.5 + 0.6 * k, -2.2 - 0.3 * k, Object.assign({}, POSE.reach, { facing: 1, lean: 0.3 })); stage.aim([-0.2, 1.5, 2.0], [0.0, 0.8, -1.6], 66); });

// ---------- overlay ----------
const CLOCK = [[0, 'HOJE', '09:12'], [L0(9), 'DIA 1', '08:00'], [L0(10), 'DIA 3', '10:30'], [L0(11), 'DIA 3', '03:00'], [L0(12), 'DIA 5', '14:20'], [L0(16), 'DIA 5', '23:10'], [L0(17), 'DIA 5', '00:00']];
const clockAt = t => { const r = CLOCK.filter(x => t >= x[0]).pop(); return [r[1], r[2]]; };
const BAL = [[0, -487], [tSign + 0.4, 13], [w(10, '380'), -367], [w(20, 'rodada'), -452]];

  if (i === 12) phone(c, (c, x, y, ww, hh) => app(c, x, y, ww, hh, 'FATURA', '#c8372d', (c, w2) => { row(c, w2, 90, 'NOITE+ BALADA', 'R$ 380', '#c8372d'); row(c, w2, 170, 'HORÁRIO', '03:12'); row(c, w2, 250, 'TITULAR', 'VOCÊ'); c.fillStyle = '#c8372d'; c.font = '700 60px Oswald'; c.textAlign = 'center'; c.fillText('??', w2 / 2, 420); }), clamp((t - L0(10)) / 0.3));
  if (i === 17) phone(c, (c, x, y, ww, hh) => { c.fillStyle = '#fff'; c.fillRect(x, y, ww, hh); c.fillStyle = '#1f2026'; c.font = '700 40px Oswald'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText('@voce · marcado', x + 30, y + 60);
    c.fillStyle = '#ff3fa4'; c.fillRect(x, y + 110, ww, 560); c.fillStyle = '#16161c'; c.lineCap = 'round'; c.strokeStyle = '#16161c'; c.lineWidth = 36; const cx = x + ww / 2, cy = y + 420; c.beginPath(); c.moveTo(cx, cy - 60); c.lineTo(cx, cy + 90); c.moveTo(cx, cy - 30); c.lineTo(cx - 90, cy - 140); c.moveTo(cx, cy - 30); c.lineTo(cx + 90, cy - 150); c.moveTo(cx, cy + 90); c.lineTo(cx - 60, cy + 210); c.moveTo(cx, cy + 90); c.lineTo(cx + 70, cy + 200); c.stroke(); c.beginPath(); c.arc(cx, cy - 120, 55, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(cx - 18, cy - 125, 8, 0, 7); c.arc(cx + 18, cy - 125, 8, 0, 7); c.fill();
    c.fillStyle = '#c8372d'; c.font = '700 64px Oswald'; c.textAlign = 'left'; c.fillText('♥ ' + likes(t).toLocaleString('pt-BR'), x + 30, y + 740); c.fillStyle = '#4a4d55'; c.font = '700 32px "JetBrains Mono"'; c.fillText('"melhor noite da vida"', x + 30, y + 820); }, clamp((t - L0(15)) / 0.3));

function contract(t) {
  const k = ease((t - tSign) / 0.25);
  if (t >= tSign && t < tRoll) paper(c, k, (c, w2, h2) => { c.fillStyle = '#1f2026'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = '700 54px Oswald'; c.fillText('CONTRATO', w2 / 2, 90); c.font = '700 34px "JetBrains Mono"'; c.fillText('COMPRA E VENDA DE SOMBRA', w2 / 2, 160);

const CHUNKS = chunkCaptions(T); window.CHUNKS = CHUNKS;
