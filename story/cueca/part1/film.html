<!doctype html>
<html><head><meta charset="utf-8"><title>Minha Cueca Virou História</title>
<script type="importmap">{"imports": {"three": "../../engine/vendor/three.module.js"}}</script>
<style>
@font-face { font-family: 'Oswald'; font-weight: 700; src: url('../../engine/vendor/fonts/oswald-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: url('../../engine/vendor/fonts/jetbrains-mono-latin-700-normal.woff2') format('woff2'); }
html, body { margin: 0; background: #000; } canvas { display: block; }

</head><body>
<canvas id="film" width="1080" height="1920"></canvas>
<script type="module">
import { run } from '../../bar_part.js';
import { setup, P } from '../stick.js';
run({
  setup, which: 'cueca',
  hud: (t, { L0 }) => t < L0(13) ? 'PIZZARIA' : t < L0(19) ? 'CASA DELA' : 'NO CARRO',
  clock: ({ L0, w }) => [[0, '21:30'], [L0(13), '23:10'], [L0(15), '23:59'], [w(15, 'meia-noite'), '00:00'], [L0(19), '00:01'], [L0(21), '00:02']],
  pressure: ({ w, L0 }) => [[0, 5], [L0(4), 10], [L0(8), 20], [w(10, 'borbulho'), 35], [L0(13), 30], [w(22, 'barulho'), 75], [w(26, 'parceiro'), 85]],
  shots: ctx => {
    const { X, at, w, L0, L1, stage, clamp, lerp, ease } = ctx; const C = X.C;
    const T = C.T, eatK = t => clamp((t - L0(4)) / (L0(8) - L0(4))), bel = t => lerp(0.12, 0.85, clamp((t - L0(4)) / (L0(10) - L0(4))));
    const pz = (o = {}) => t => X.pizza(t, Object.assign({ eat: eatK(t), belly: bel(t) }, o));
    const pizzaAt = i => { const a = i / 5 * Math.PI * 2 + 0.3; return [T[0] + Math.cos(a) * 0.4, T[1] + Math.sin(a) * 0.4]; };
    const youFace = (o = {}) => (t, u) => { pz(o)(t); const k = ease(clamp(u / 2)); const sh = o.shake ? o.shake * Math.sin(t * 60) : 0; X.face(X.you, lerp(1.05, 0.85, k), 0.05 + sh, 0.22, 42, [0, -0.12, 0]); };
    const herFace = (o = {}) => (t, u) => { pz(o)(t); const h = X.her.headWorld(); stage.aim([h.x - 0.05, h.y + 0.12, h.z + 1.0], [h.x, h.y - 0.08, h.z], 42); };
    const tableTop = (o = {}) => (t, u) => { pz(o)(t); const a = 0.25 * u; stage.aim([T[0] + Math.sin(a) * 0.25, 1.75, T[1] + Math.cos(a) * 0.25 + 0.15], [T[0], 0.75, T[1]], 52); };
    const bellyShot = (o = {}) => (t, u) => { pz(Object.assign({ you: P.belly }, o))(t); const h = X.you.headWorld(); const sh = (o.shake || 0) * Math.sin(t * 70); stage.aim([h.x + 0.95 + sh, 0.95, h.z + 0.75], [h.x, 0.8, h.z], 44); };
    // the pizzeria
    at(0, (t, u) => { pz()(t); const k = ease(clamp(u / 4)); stage.aim([lerp(2.6, 1.6, k), lerp(1.9, 1.5, k), lerp(3.2, 2.0, k)], [0, 0.9, -0.1], 50); });
    at(L0(1), (t, u) => { pz()(t); stage.aim([0.6, 1.5, 0.4], [-0.8, 2.3, -2.9], 52); });
    at(w(1, 'vela'), (t, u) => { pz()(t); stage.aim([T[0] + 0.32, 0.95, T[1] + 0.32], [T[0], 0.85, T[1]], 36); });
    at(w(1, 'Você'), (t, u) => { pz()(t); stage.aim([1.5, 1.45, 1.9], [0.25, 1.0, -0.2], 46); });
    at(L0(2), tableTop());
    at(L0(3), (t, u) => { pz()(t); const [x, z] = pizzaAt(4); const k = ease(clamp(u / 2)); stage.aim([x + 0.25, lerp(1.2, 1.0, k), z + 0.35], [x, 0.76, z], 40); });
    at(L0(4), youFace({ you: P.eat }));
    at(w(4, 'Depois', 1), tableTop());
    at(L0(5), herFace());
    at(w(5, 'preocupada'), herFace({ her: { facing: -1, mood: 'scared', armL: [0.9, -1.2], armR: [-0.9, 1.2] } }));
    at(L0(6), herFace({ her: { facing: -1, mood: 'scared', armL: [0.9, -1.2], armR: [-1.6, 0.6] } }));
    at(L0(7), youFace({ you: P.eat }));
    at(w(7, 'passa'), youFace({ you: { facing: 1, armL: [0.9, -1.2], armR: [-1.7, 0.2] } }));
    at(L0(8), tableTop());
    at(L0(9), (t, u) => { pz()(t); stage.aim([1.5, 1.45, 1.9], [0.25, 1.0, -0.2], 46); });
    at(w(9, 'perigo'), (t, u) => { pz({ you: { facing: 0, mood: 'scared', armL: [0.9, -1.2], armR: [-0.9, 1.2] } })(t); const k = ease(clamp(u / 0.25)); const h = X.you.headWorld(); stage.aim([lerp(1.5, h.x + 0.05, k), lerp(1.45, h.y + 0.15, k), lerp(1.9, h.z + 0.75, k)], [h.x, h.y - 0.05, h.z], lerp(46, 40, k)); });
    at(L0(10), bellyShot());
    at(w(10, 'borbulho'), bellyShot({ shake: 0.012 }));
    at(L0(11), bellyShot());
    at(L0(12), youFace({ you: P.eat }));
    // her room, seen from above
    at(L0(13), (t, u) => { X.room(t, { clock: '23:10', belly: 0.9 }); const k = ease(clamp(u / 3)); stage.aim([-1.9, lerp(2.5, 2.2, k), 2.6], [0.2, 0.4, -1.0], 50); });
    at(w(13, 'deita'), (t, u) => { X.room(t, { clock: '23:10', belly: 0.9 }); X.top(lerp(74, 68, clamp(u / 3))); });
    at(L0(14), (t, u) => { X.room(t, { clock: '23:40', belly: 0.95 + 0.12 * Math.sin(t * 2.4) }); const h = X.youBed.mesh.position; stage.camera.up.set(0, 0, -1); stage.aim([h.x + 0.01, 1.75, h.z - 0.72], [h.x, 0.5, h.z - 0.73], 44); });
    at(L0(15), (t, u) => { X.room(t, { clock: t < w(15, 'meia-noite') ? '23:59' : '00:00' }); C.clockGlow.intensity = t < w(15, 'meia-noite') ? 0.8 : 1.6 + 0.8 * Math.sin(t * 12); stage.aim([1.0, 0.8, -0.55], [1.15, 0.58, -1.43], 40); });
    at(L0(16), (t, u) => { const k = clamp(u / 0.25); X.room(t, { clock: '00:00', you: k < 1 ? undefined : { facing: 0, mood: 'scared', armL: [2.4, 0.3], armR: [-2.4, -0.3], legL: [0.3, 0], legR: [-0.3, 0] } }); const sh = k >= 1 ? 0.03 * Math.sin(t * 50) * Math.max(0, 1 - (u - 0.25) * 2) : 0; X.top(68 + sh * 20); });
    at(L0(17), (t, u) => { const k = ease(clamp(u / 0.9)); X.room(t, { clock: '00:00', you: { facing: 1, armL: [0.6, -0.2], armR: [-0.6, 0.2] } }); X.youBed.mesh.position.set(lerp(-0.38, 0.05, k), 0.55, lerp(-0.08, -0.2, k)); X.youBed.mesh.rotation.z = lerp(0.06, -0.35, k); X.top(66); });
    at(w(17, 'embora'), (t, u) => { const k = clamp(u / 2.2); X.room(t, { clock: '00:00', youOn: false, standing: [lerp(-0.9, 1.75, k), lerp(0.4, 3.2, k), P.stand] }); X.youRoom.walk(t * 0.6, { speed: 0.45, stride: 0.25, facing: 1 }); C.roomDoor.userData.open(1.2); C.hallGlow.intensity = 3; stage.aim([-1.8, 1.7, -1.3], [1.4, 1.0, 2.6], 50); });
    at(L0(18), (t, u) => { const k = ease(clamp(u / 2.6)); X.room(t, { clock: '00:01', youOn: true }); C.roomDoor.userData.open(lerp(1.2, 0, k)); C.hallGlow.intensity = 3 * (1 - k); stage.aim([0.6, 1.5, 0.9], [1.9, 1.1, 3.4], 50); });
    // the car
    at(L0(19), (t, u) => { X.drive(t, { speed: lerp(0, 3, clamp(u / 2)) }); stage.aim([2.6, 1.3, 5.2], [0, 0.8, 0.2], 46); });
    at(w(19, 'Liga'), (t, u) => { X.drive(t, { speed: 2, bump: 0.01 * Math.sin(t * 70) }); const h = X.youCar.headWorld(); stage.aim([h.x - 0.55, h.y + 0.05, 0.95], [h.x - 0.05, h.y - 0.15, h.z], 52); });
    at(L0(20), (t, u) => { X.drive(t, { pose: { facing: 0, headTilt: -0.1, armL: [1.2, -0.6], armR: [-1.2, 0.6] } }); stage.aim([-0.45, 1.35, 1.0], [0.35, 1.15, -0.1], 56); });
    at(w(20, 'Paz'), (t, u) => { X.drive(t); const k = ease(clamp(u / 3)); stage.aim([lerp(-1.5, -3, k), lerp(2.6, 4, k), lerp(-6, -9, k)], [0, 0.8, 3], 48); });
    at(L0(21), (t, u) => { X.drive(t); stage.aim([-4.5, 1.2, 2.0], [0, 0.9, 0], 40); });
    at(L0(22), (t, u) => { X.drive(t, { pose: P.grip, bump: 0.008 * Math.sin(t * 90) }); const h = X.youCar.headWorld(); const sh = 0.01 * Math.sin(t * 70); stage.aim([h.x - 0.3 + sh, h.y - 0.12, 1.0], [h.x, h.y - 0.3, h.z], 50); });
    at(L0(23), X.carFace());
    at(w(23, 'some'), X.carFace({ pose: { facing: 0, mood: 'scared', armL: [1.2, -0.6], armR: [-1.2, 0.6] } }));
    at(L0(24), X.carFace({ pose: { facing: 0, mood: 'scared', headTilt: 0.35, armL: [1.2, -0.6], armR: [-1.2, 0.6] }, d0: 0.9, d1: 0.8 }));
    at(L0(25), (t, u) => { X.drive(t, { pose: P.grip }); const h = X.youCar.headWorld(); X.sweat(X.youCar, clamp(u / (L1(25) - L0(25) + 0.2)), -1); stage.aim([h.x - 0.2, h.y + 0.02, h.z + 0.42], [h.x - 0.06, h.y - 0.03, h.z], 32); });
    at(L0(26), X.carFace({ pose: P.grip, shake: 0.012, d0: 0.85, d1: 0.7 }));
  },
  overlay: (ctx, t) => { const { w, L0, bang } = ctx;
    const pop = (s, t0, o, dur = 1.3) => { if (t >= t0 && t < t0 + dur) bang(s, (t - t0) * 1.4, o); };
    pop('47 FATIAS', w(8, 'fatias'), { y: 560, col: '#ffcc4d', size: 170 });
    pop('BLURP...', w(10, 'borbulho'), { y: 560, col: '#8fe06a', size: 150 });
    pop('toc toc', w(11, 'porta'), { y: 560, col: '#ffffff', size: 110, rot: 0.06 });
    pop('ERRO Nº 1', w(12, 'Erro'), { y: 560, col: '#ff5a4f', size: 150 });
    pop('SMACK!', w(17, 'beijo') + 0.5, { y: 600, col: '#ff7aa0', size: 150 });
    pop('GRUUUOOONNN!', w(22, 'barulho'), { y: 600, col: '#8fe06a', size: 140, shake: 1 }, 1.8);
  },
  end: { q: ['VOCÊ FAZ', 'O QUÊ?'], a: 'ACELERO PRA CASA', b: 'PARO NUM POSTO', next: '2' },
  cover: { at: ({ L0 }) => L0(7) + 0.6, pill: 'MINHA CUECA VIROU HISTÓRIA · PARTE 1', title: ['47 FATIAS', 'DE PIZZA'], color: '#ffcc4d', gauge: 35 },
});
</script>
</body></html>
