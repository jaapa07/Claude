<canvas id="film" width="1080" height="1920"></canvas>
<script type="module">
import { run } from '../../bar_part.js';
import { setup, P } from '../stick.js';
import { BASE, audioPhone } from '../common.js';
run(Object.assign({}, BASE, {
  setup,
  hud: (t, { L0 }) => t < L0(15) ? 'SNOOKER BAR' : 'GRUPO DO BAIRRO',
  clock: ({ L0 }) => [[0, '23:47'], [L0(6), '23:47'], [L0(15), '09:12']],
  pressure: ({ w, L0 }) => [[0, 30], [w(2, 'novo'), 60], [L0(3), 45], [w(7, 'berra'), 80], [L0(8), 55], [L0(10), 65], [w(12, 'apaga'), 85], [w(14, 'grito'), 95], [L0(15), 60], [w(17, 'chupa-cu'), 100], [L0(18), 80]],
  shots: ctx => {
    const { X, at, w, L0, L1, stage, clamp, lerp, ease } = ctx; const W = X.W, PT = W.PT;
    const STOOL = [-2.45, 0.6];
    const regulars = (t, o = {}) => { X.put(X.you, -3.6, 0.4, o.you || P.stand); X.put(X.cli, ...STOOL, o.cli || P.clutch); X.put(X.ami, -2.4, 1.6, o.ami || P.stand); X.put(X.patrons[0], 0.0, 1.0, P.stand); X.put(X.patrons[1], 1.5, -0.6, P.talk(t)); };
    // the bar, from the street
    at(0, (t, u) => { X.street(t); X.put(X.crowd[0], -4, 0.3, P.stand); const k = ease(clamp(u / 3.5)); stage.aim([lerp(-1.2, 0.4, k), 1.7, lerp(7.5, 5.0, k)], [0.6, 1.7, -1], 50); });
    at(L0(1), (t, u) => X.black());
    at(L0(3), (t, u) => { X.bar(t, { clock: [23, 48] }); regulars(t); const h = X.cli.headWorld(); const k = ease(clamp(u / 2)); stage.aim([h.x + 1.3, lerp(1.4, 1.3, k), h.z + lerp(1.9, 1.5, k)], [h.x, 1.0, h.z], 46); });
    at(L0(4), (t, u) => { X.bar(t, { clock: [23, 48] }); regulars(t, { you: { facing: 0, headTilt: -0.35, armL: [0.3, -0.3], armR: [-0.3, 0.3] } }); X.faceFrom(X.you, [0.35, 0, 0.95], 0.95); });
    at(L0(5), (t, u) => { X.bar(t, { clock: [23, 48] }); regulars(t, { cli: P.point(1), ami: { facing: -1, mood: 'scared', armL: [0.3, -0.3], armR: [-0.3, 0.3] } }); stage.aim([-0.3, 1.4, 3.2], [-2.4, 1.0, 1.1], 46); });
    // a Friday before: the eight ball
    at(L0(6), (t, u) => { X.bar(t, { clock: [23, 46] }); X.put(X.ami, PT[0] + 0.35, PT[1] + 1.75, P.cue); X.put(X.cli, PT[0] - 1.2, PT[1] + 0.6, P.stand); X.put(X.you, -3.6, 0.4, P.stand); const k = ease(clamp(u / 3)); const [bx, by, bz] = W.ball8Home; stage.aim([bx - 0.5, lerp(1.1, 0.95, k), bz + lerp(0.9, 0.6, k)], [bx, by, bz], 44); });
    at(L0(7), (t, u) => { X.bar(t, { clock: [23, 47] }); stage.aim([-2.6, 1.3, -2.4], [-3.4, 1.0, -3.6], 44); });
    at(w(7, 'letreiro'), (t, u) => { X.bar(t, { clock: [23, 47] }); W.signOn(false); stage.aim([0.6, 1.9, 2.6], [0.8, 2.1, 4.4], 46); });
    at(w(7, 'berra'), (t, u) => X.black());
    at(L0(8), (t, u) => { X.bar(t, { clock: [23, 48], ball8: 0.55 }); const [px, pz] = W.pockets[5]; const k = ease(clamp(u / 2)); stage.aim([px - 0.28, lerp(1.15, 1.05, k), pz - 0.28], [px - 0.03, 0.8, pz - 0.03], 32); });
    at(L0(9), (t, u) => { X.bar(t, { clock: [23, 48], ball8: 0.55 }); X.put(X.ami, PT[0] + 0.35, PT[1] + 1.75, { facing: 0, mood: 'scared', headTilt: 0.2, armL: [0.3, -0.3], armR: [-0.3, 0.3] }); X.face(X.ami, 0.9); });
    // the third Friday: they come prepared
    at(L0(10), (t, u) => { X.bar(t, { clock: [23, 30] }); regulars(t, { cli: P.stand }); X.put(X.patrons[2], 2.2, 2.4, P.stand); X.wide(u); });
    at(L0(11), (t, u) => { X.bar(t, { clock: [23, 40] }); X.put(X.cli, 0.0, 2.2, P.stand); const h = X.cli.headWorld(); W.headlamp.intensity = 10; W.headlamp.position.set(h.x, h.y + 0.12, h.z + 0.05); W.headlamp.target.position.set(h.x, 0.6, h.z + 3); X.face(X.cli, 1.2, 0.2); });
    at(w(11, 'Outro'), (t, u) => { X.bar(t, { clock: [23, 40] }); const k = ease(clamp(u / 1.5)); X.put(X.ami, lerp(2.4, 3.55, k), 2.4, { facing: 1, lean: 0.3, armL: [1.4, -0.2], armR: [1.2, -0.2] }); W.stools[3].position.set(lerp(2.75, 3.75, k), 0, 2.4); stage.aim([1.0, 1.4, 4.2], [3.0, 0.8, 2.4], 46); });
    at(L0(12), (t, u) => { X.bar(t, { clock: [23, 47] }); W.stools[3].position.set(-2.45, 0, 1.45); stage.aim([1.15, 2.3, -3.6], [1.2, 2.35, -4.43], 40); });
    at(w(12, 'apaga'), (t, u) => X.black());
    at(L0(13), (t, u) => { X.bar(t, { power: false, clock: [23, 47] }); X.put(X.cli, 0.0, 2.2, { facing: 0, mood: 'scared', armL: [0.5, -1.9], armR: [-0.5, 1.9] }); const h = X.cli.headWorld(); W.headlamp.intensity = 2.5; W.headlamp.position.set(h.x, h.y + 0.05, h.z + 0.7); W.headlamp.target.position.set(h.x, h.y, h.z); X.face(X.cli, 0.85); });
    at(L0(14), (t, u) => X.black());
    // the next morning: the audio goes round
    const phoneShot = who => (t, u) => { X.street(t, { day: true }); X.put(X.s[who], -1.2, 1.0, P.phone); X.face(X.s[who], 1.0, 0.1); };
    at(L0(15), phoneShot('cabel'));
    at(L0(16), phoneShot('cabel'));
    at(w(16, 'padeiro'), phoneShot('padeiro'));
    at(w(16, 'você'), phoneShot('you'));
    at(L0(17), phoneShot('you'));
    at(L0(18), (t, u) => { X.street(t, { day: true }); X.put(X.s.turista, 0.9, 1.2, { facing: 0, headTilt: -0.1, armR: [-2.5, 0.6], armL: [0.6, -0.2] }); X.put(X.crowd[1], -3.2, 1.1, P.stand); const k = ease(clamp(u / 3)); stage.aim([lerp(0.6, 0.9, k), 1.5, lerp(5.0, 3.8, k)], [0.8, 1.6, -0.8], 50); });
  },
  overlay: (ctx, t) => { const { w, L0, L1, bang, c, clamp } = ctx;
    const pop = (s, t0, o, dur = 1.3) => { if (t >= t0 && t < t0 + dur) bang(s, (t - t0) * 1.4, o); };
    pop('TOC!', w(1, 'caçapa'), { y: 760, col: '#ffffff', size: 150 });
    pop('UMA SEXTA ANTES...', L0(6), { y: 520, col: '#ffcc4d', size: 90, rot: 0 }, 1.8);
    pop('AAAAAH!', w(7, 'berra'), { y: 820, col: '#ff5a4f', size: 190, shake: 1 }, 1.4);
    pop('3ª SEXTA', L0(10), { y: 520, col: '#ffcc4d', size: 110, rot: 0 }, 1.6);
    pop('AAAAAAH!', w(14, 'grito'), { y: 820, col: '#ff5a4f', size: 190, shake: 1 }, 1.8);
    if (t >= L0(17) && t < L1(17) + 0.4) audioPhone(c, 'Mãe ❤', clamp((t - L0(17)) / (L1(17) - L0(17))), 'Áudio encaminhado várias vezes');
  },
  end: { q: ['QUEM É O', 'CHUPA-CU?'], a: 'UM FREGUÊS', b: 'ALGUÉM DE FORA', next: '2' },
  cover: { at: ({ L0 }) => L0(13) + 0.6, pill: 'O CHUPA-CU DO SNOOKER BAR · PARTE 1', title: ['TODA SEXTA,', 'ALGUÉM GRITAVA'], color: '#ff5a4f', gauge: 85 },
}));
</script>
