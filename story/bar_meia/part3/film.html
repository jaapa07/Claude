<script type="module">
import { run } from '../../bar_part.js';
import { shots } from '../../bar_common_shots.js';
run({
  which: 'meia', hud: 'BAR DA UNIVEL',
  clock: ({ L0 }) => [[0, '22:12'], [L0(11), '22:20'], [L0(14), '00:00'], [L0(18), '00:14']],
  pressure: ({ w, L0 }) => [[0, 30], [w(3, 'meia'), 55], [L0(4), 70], [w(5, 'rir'), 40], [w(9, 'guardou'), 85], [w(10, 'pânico'), 95], [L0(14), 20], [w(18, 'funga'), 60], [w(19, 'Duas'), 80], [w(20, 'verde'), 95], [w(21, 'meia'), 99]],
  shots: ctx => {
    const { X, POSE, at, w, L0, stage, clamp, lerp, ease, THREE } = ctx; const S = shots(ctx); const Wd = X.Wd, TB = X.TB;
    X.you.o.mark.bare = 'R';
    const sockTip = (t, k = 1) => { const h = X.head(X.you); Wd.sockBar.visible = true; Wd.sockBar.position.set(h.x + 0.2, lerp(0.7, 0.86, k), h.z + 0.12); Wd.sockBar.rotation.set(0.2, 0, -0.3); };
    at(0, S.wideFront({ mood: 'chat', you: POSE.table }));
    at(L0(1), S.friendFace(X.f1, { mood: 'stare' }));
    at(L0(2), S.youFace({ mood: 'stare', you: t => Object.assign({}, POSE.whisper, { facing: Math.sin(t * 3) > 0 ? 1 : -1 }), d0: 1.0, d1: 0.9 }));
    at(L0(3), S.youFace({ mood: 'stare', you: POSE.whisper, d0: 0.9, d1: 0.7 }));
    at(L0(4), S.friendFace(X.f1, { mood: 'blank', you: POSE.table })); at(w(4, 'Três'), S.friendFace(X.f2, { mood: 'blank', you: POSE.table }));
    at(L0(5), S.wideFront({ mood: 'laugh', you: POSE.scared }));
    at(L0(6), S.friendFace(X.f1, { mood: 'laugh', you: POSE.scared }));
    at(L0(7), (t, u) => { X.table(t, { mood: 'laugh', you: Object.assign({}, POSE.table, { armR: [-0.4, 0.6] }) }); sockTip(t, ease(clamp(u / 0.8))); const h = X.head(X.you); stage.aim([h.x + 0.6, 0.95, h.z + 0.75], [h.x + 0.2, 0.8, h.z + 0.12], 40); });
    at(L0(8), (t, u) => { const k = ease(clamp((u - 0.3) / 0.35)); X.table(t, { mood: 'shock', push: k, you: POSE.table }); sockTip(t); stage.aim([TB[0] + 0.3, 1.9, TB[1] + 3.0], [TB[0], 0.85, TB[1] - 0.1], 64); });
    at(L0(9), S.friendFace(X.f2, { mood: 'shock', push: 1 }));
    at(L0(10), S.youFace({ mood: 'shock', push: 1, you: POSE.shock, d0: 0.9, d1: 0.75 }));
    at(L0(11), (t, u) => { X.table(t, { mood: 'laugh', push: 1, you: POSE.scared }); X.put(X.f1, X.seat.f1[0] - 0.5, X.SEAT, X.seat.f1[1], { facing: 1, armR: [-2.6, 0.4], armL: [2.6, -0.4] }); const h = X.head(X.f1); Wd.phone.visible = true; Wd.phone.position.set(h.x + 0.05, h.y + 0.35, h.z + 0.05); Wd.phone.rotation.set(0, Math.PI / 2, 0); stage.aim([h.x + 0.9, h.y + 0.2, h.z + 1.0], [h.x + 0.2, h.y + 0.05, h.z], 46); });
    at(L0(12), (t, u) => { X.table(t, { mood: 'shock', push: 1, you: POSE.scared }); const [x, z] = Wd.bgTables[3]; [X.patrons[2], X.patrons[3]].forEach((p, i) => { p.walk(t, { speed: 1.2, facing: 1 }); p.mesh.position.set(x - 0.6 + i * 1.2 + clamp(u / 2) * 2.2, 0, z + 0.3 * i); p.mesh.visible = true; }); stage.aim([TB[0] + 1.2, 1.7, TB[1] + 3.2], [TB[0] + 1.6, 0.9, TB[1] + 0.2], 58); });
    at(L0(13), (t, u) => { X.table(t, { mood: 'shock', push: 1, you: POSE.scared }); X.waiter.walk(t, { speed: 1.0, facing: -1 }); X.waiter.mesh.position.set(lerp(TB[0] + 0.6, 3.4, clamp(u / 2.6)), 0, TB[1] - 0.95); X.waiter.mesh.visible = true; stage.aim([TB[0] + 1.6, 1.5, TB[1] + 1.8], [TB[0] + 1.0, 1.0, TB[1] - 0.7], 54); });
    at(L0(14), (t, u) => { X.car(t, { people: true }); stage.aim([lerp(3.4, 2.6, clamp(u / 2.2)), 0.9, lerp(5.2, 4.0, clamp(u / 2.2))], [0, 0.9, 0.5], 46); });
    at(L0(15), (t, u) => { X.car(t); const h = X.leoCar.headWorld(); stage.aim([h.x - 0.1, h.y + 0.02, 0.95], [h.x, h.y - 0.02, h.z], 46); });
    at(L0(16), (t, u) => { X.car(t); Wd.pine.visible = false; Wd.mirror.visible = false; stage.aim([0.05, 1.4, 1.7], [0, 1.2, -0.05], 58); });
    at(L0(17), (t, u) => { X.car(t); Wd.pine.visible = true; Wd.mirror.visible = true; const p = Wd.pine.getWorldPosition(new THREE.Vector3()); Wd.stinkAt(t, 0.6, p); stage.aim([p.x + 0.12, p.y + 0.03, p.z - 0.35], [p.x, p.y, p.z], 40); });
    at(L0(18), (t, u) => { X.car(t, { leo: { facing: -1, headTilt: -0.15 * Math.max(0, Math.sin(t * 14)), armL: [1.2, -0.6], armR: [-1.2, 0.6] } }); const h = X.leoCar.headWorld(); stage.aim([h.x - 0.25, h.y + 0.02, 0.92], [h.x, h.y - 0.02, h.z], 44); });
    at(L0(19), (t, u) => { X.car(t, { leo: { facing: -1, mood: 'scared', headTilt: -0.15 * Math.max(0, Math.sin(t * 14)), armL: [1.2, -0.6], armR: [-1.2, 0.6] } }); const h = X.leoCar.headWorld(); stage.aim([h.x - 0.15, h.y + 0.02, 0.85], [h.x, h.y - 0.02, h.z], 40); });
    at(L0(20), (t, u) => { X.car(t, { you: { facing: 0, mood: 'scared', armL: [0.05, -0.05], armR: [-0.05, 0.05] } }); const p = X.youCar.mesh.position.clone().add(new THREE.Vector3(0.05, 0.55, 0.12)); Wd.stinkAt(t, ease(clamp(u / 0.6)), p); stage.aim([p.x + 0.3, p.y + 0.85, 0.95], [p.x, p.y + 0.4, p.z], 58); });
    at(L0(21), (t, u) => { X.car(t, { leo: { facing: -1, mood: 'scared', armL: [1.2, -0.6], armR: [-1.2, 0.6] } }); Wd.stinkAt(t, 0.7, X.youCar.mesh.position.clone().add(new THREE.Vector3(0.05, 0.55, 0.12))); const h = X.leoCar.headWorld(); stage.aim([h.x - 0.35, h.y + 0.02, 0.92], [h.x, h.y - 0.02, h.z], 46); });
  },
  overlay: (ctx, t) => { const { w, L0, bang, c } = ctx;
    if (t >= w(5, 'rir') && t < w(5, 'rir') + 1.0) bang('KKKKKK', (t - w(5, 'rir')) * 1.6, { y: 620, col: '#4fe08a', size: 170 });
    if (t >= w(11, 'foto') && t < w(11, 'foto') + 0.25) { c.save(); c.globalAlpha = 1 - (t - w(11, 'foto')) / 0.25; c.fillStyle = '#fff'; c.fillRect(0, 0, 1080, 1920); c.restore(); }
    if (t >= w(18, 'funga') && t < w(18, 'funga') + 0.9) bang('*FUNGA*', (t - w(18, 'funga')) * 1.6, { y: 560, col: '#ffffff', size: 120, rot: 0 });
    if (t >= L0(19) && t < L0(19) + 0.9) bang('*FUNGA FUNGA*', (t - L0(19)) * 1.6, { y: 560, col: '#ffffff', size: 100, rot: 0 });
  },
  end: { q: ['O QUE VOCÊ', 'RESPONDE?'], a: 'DEPENDE...', b: 'QUE MEIA?', next: 4 },
  cover: { at: ({ L0 }) => L0(8) + 1.2, pill: 'A MEIA DO RENY · PARTE 3', title: ['VOCÊ GUARDOU', 'A MEIA?!'], color: '#ff5a4f', gauge: 85 },
});
</script>
