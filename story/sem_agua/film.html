<script type="module">
import * as S from '../engine/stage.js';
import { buildWorld } from './world.js';
import { FACE, mixFace } from './toon.js';
const { THREE, clamp, lerp, ease, spring, chunkCaptions, loadFonts } = S;
const T = window.TIMING;
const w = (li, word, n = 0) => { const b = s => s.toLowerCase().replace(/[^\p{L}0-9:]/gu, ''); let k = 0; for (const x of T.lines[li].words) if (b(x.w) === b(word) && k++ === n) return x.s; throw new Error(`word "${word}" not in line ${li}`); };
const L0 = li => T.lines[li].start, L1 = li => T.lines[li].end;
const c = document.getElementById('film').getContext('2d');
const stage = S.createStage(document.getElementById('film'));
stage.renderer.toneMappingExposure = 1.05;
const Wd = buildWorld(stage);
const { hero, beto, carla, ze, lady, waiter, put, seat, T: TB } = Wd;
const MODE = location.hash.slice(1), COVER = MODE.startsWith('cover');

// ---------------- the beats (seconds); sound.py reads the same numbers from window.BEATS ----------------
const B = {};
B.clink = w(0, 'amigos') + 0.18; B.fuga = w(1, 'fuga');
B.growl = L1(1) + 0.45; B.mont = B.growl + 1.85; B.m = [0, 1, 2, 3].map(k => B.mont + k * 1.27); B.ask = L0(2); B.reply = L0(3); B.muscle = L0(4);
B.stand = L0(5) - 0.15; B.slam = L0(7) - 1.35; B.sigh = L0(7) - 1.0;
B.flush1 = L1(7) + 0.55; B.flush2 = B.flush1 + 1.8; B.holy = B.flush2 + 2.9; B.grab = B.holy + 1.7; B.tap = B.grab + 0.9; B.puff = B.tap + 0.12;
B.lookToilet = L1(8) + 0.25; B.lookDoor = B.lookToilet + 1.3; B.breath = L1(9) + 0.25; B.open = B.breath + 1.5; B.reveal = B.open + 0.9;
B.herLook = B.reveal + 1.2; B.hisFace = B.herLook + 1.1; B.wave = B.hisFace + 1.2; B.nod = B.wave + 0.8; B.leave = B.nod + 1.7; B.herIn = B.leave + 0.8; B.doorShut = B.herIn + 0.55;
B.whisper = L0(10); B.laugh = w(10, 'descar') + 0.3; B.hide = B.laugh + 0.9; B.getUp = L1(11) + 0.1; B.out = L0(12); B.interd = w(13, 'impressão') - 0.15;
B.credits = L1(13) + 0.6; B.black = B.credits + 4.0; B.flushOK = B.black + 0.25; B.end = B.flushOK + 2.3;
window.BEATS = B; window.TOTAL = B.end;

// ---------------- small helpers ----------------
const fwd = ry => new THREE.Vector3(Math.sin(ry), 0, Math.cos(ry)), rightOf = ry => new THREE.Vector3(Math.cos(ry), 0, -Math.sin(ry));
// a camera in front of someone's face: dist forward, side to their left(-)/right(+) as we see it, up; looks at the head (+ aim offset)
function faceCam(who, dist, side = 0, up = 0, fov = 40, aim = [0, 0, 0]) {
  const h = who.headPos(), ry = who.root.rotation.y, f = fwd(ry), r = rightOf(ry);
  dist *= 2.0; side *= 1.6; const p = h.clone().addScaledVector(f, dist).addScaledVector(r, -side).add(new THREE.Vector3(0, up, 0));
  stage.aim([p.x, p.y, p.z], [h.x + aim[0], h.y + aim[1], h.z + aim[2]], fov);
}
const shake = (t, a) => [a * Math.sin(t * 53), a * Math.cos(t * 41)];
const sitPose = (o = {}) => Object.assign({ sit: 1, armL: [0.95, 0.12, 0.85], armR: [0.95, 0.12, 0.85], legL: [0, 0.06, 0], legR: [0, 0.06, 0] }, o);
// friends at the table: chatting, laughing (k: 0..1 laugh strength)
function friends(t, mood = 'chat', k = 1) {
  const L = mood === 'laugh';
  const bob = L ? Math.abs(Math.sin(t * 9)) * 0.12 * k : 0;
  put(beto, seat.beto[0], seat.beto[1], seat.beto[2], sitPose(L ? { lean: -0.2 * k + bob, head: [-0.25 * k, 0, 0], armR: [0.6 + 1.2 * Math.abs(Math.sin(t * 7)) * k, 0.2, 0.5], armL: [0.3, 0.3, 1.9] } : { armR: [0.95 + 0.25 * Math.sin(t * 2.3), 0.15, 0.9], head: [0, 0.25 * Math.sin(t * 0.7), 0] }), L ? FACE.laugh : (mood === 'ask' ? FACE.worried : FACE.smile), L ? [0, 0] : [0.3, 0], Wd.blink(t, 1));
  put(carla, seat.carla[0], seat.carla[1], seat.carla[2], sitPose(L ? { lean: -0.3 * k + bob, head: [-0.35 * k, 0, 0.1], armL: [2.0, 0.3, 1.6], armR: [2.0, 0.3, 1.6] } : { head: [0, -0.2 + 0.15 * Math.sin(t * 0.9), 0.05], armL: [1.0, 0.1, 1.3 + 0.3 * Math.sin(t * 1.6)] }), L ? FACE.laugh : FACE.smile, L ? [0, 0] : [-0.3, 0], Wd.blink(t, 2));
  put(ze, seat.ze[0], seat.ze[1], seat.ze[2], sitPose(L ? { lean: 0.35 * k * Math.abs(Math.sin(t * 5)), side: 0.1 * Math.sin(t * 6), armL: [0.4, 0.2, 2.3], armR: [0.9, 0.1, 0.4] } : { head: [0, 0.2 * Math.sin(t * 0.5), 0] }), L ? FACE.laugh : FACE.happy, [0, 0], Wd.blink(t, 3));
}
// background patrons: sitting at the other tables, talking
function patrons(t) {
  const P = Wd.extras, tb = Wd.bgTables;
  [[0, -1], [1, 1], [2, -1], [3, 1]].forEach(([i, sd], k) => { const [x, z] = tb[k]; put(P[i], x + sd * 0.6, z, -sd * Math.PI / 2, sitPose({ armR: [0.9 + 0.3 * Math.sin(t * (1.3 + k)), 0.15, 1.0], head: [0, 0.2 * Math.sin(t * 0.6 + k), 0] }), k % 2 ? FACE.laugh : FACE.smile, [0, 0], Wd.blink(t, 5 + k)); });
}
// the hero at the table, glass placement
function heroAtTable(t, pose, face, look = [0, 0], extra) { put(hero, seat.hero[0], seat.hero[1], 0, sitPose(pose), face, look, Wd.blink(t, 0), extra); }

function resetGlasses() { const T0 = TB, Y = 0.74; Wd.glasses.hero.position.set(T0[0], Y, T0[1] - 0.28); Wd.glasses.beto.position.set(T0[0] - 0.28, Y, T0[1]); Wd.glasses.carla.position.set(T0[0] + 0.28, Y, T0[1]); Wd.glasses.ze.position.set(T0[0], Y, T0[1] + 0.28); }

  const ph = t * 11; put(who, x, z, ry, { lean: -0.04, hipY: -0.01 + 0.01 * Math.abs(Math.sin(ph)), legL: [amp * Math.sin(ph), -0.04, 0.12 + 0.12 * Math.max(0, Math.sin(ph))], legR: [-amp * Math.sin(ph), -0.04, 0.12 + 0.12 * Math.max(0, -Math.sin(ph))], armL: [0.05, 0.05, 0.1], armR: [0.05, 0.05, 0.1], side: 0.03 * Math.sin(ph), head: [-0.05, 0, 0] }, face, look, 0, { sweatT: t }); }
// the waddle on the street: bow-legged, slow, chin up
function waddle(who, x, z, ry, t, face) { const ph = t * 6.5; put(who, x, z, ry, { lean: -0.06, side: 0.09 * Math.sin(ph), hipSide: -0.06 * Math.sin(ph), legL: [0.3 * Math.sin(ph), 0.2, 0.2 + 0.15 * Math.max(0, Math.sin(ph))], legR: [-0.3 * Math.sin(ph), 0.2, 0.2 + 0.15 * Math.max(0, -Math.sin(ph))], armL: [0.2 * Math.sin(ph), 0.25, 0.3], armR: [-0.2 * Math.sin(ph), 0.25, 0.3], head: [-0.12, 0, 0] }, face, [0, -0.2], 0); }
const BATH_SEAT = [1.38, -10.35, Math.PI / 2];
const onToilet = (o = {}) => Object.assign({ sit: 1, hipY: 0.0, armL: [0.6, 0.2, 1.2], armR: [0.6, 0.2, 1.2], legL: [0, 0.12, 0], legR: [0, 0.12, 0] }, o);
function bathScene(t, { door = 0, holy = 0 } = {}) { barScene(t); Wd.bdoor.userData.open(door); Wd.holyOn(t, holy); }

// ---------------- the shots ----------------
const SH = [], at = (t0, f) => SH.push([t0, f]);
// ===== 1. a cervejinha inocente =====
at(0, (t, u) => { table(t); heroAtTable(t, { armR: [0.95 + 0.2 * Math.sin(t * 1.5), 0.15, 1.0] }, FACE.smile, [-0.3, 0]);
  const k = ease(clamp(u / 3)); stage.aim([lerp(2.6, 1.9, k), lerp(2.5, 1.75, k), lerp(3.6, 2.5, k)], [0.55, 0.95, 0.2], 52); });
at(w(0, 'cervejinha') - 0.1, (t, u) => { table(t); const k = ease(clamp((t - (B.clink - 0.8)) / 0.8)), sh = t >= B.clink ? 0.01 * Math.max(0, 1 - (t - B.clink) * 4) : 0;
  const up = (o) => ({ armR: [lerp(0.95, 1.45, k), lerp(0.12, -0.32, k), lerp(0.85, 0.15, k)] });
  heroAtTable(t, up(), FACE.happy); put(beto, seat.beto[0], seat.beto[1], seat.beto[2], sitPose(up()), FACE.happy);
  put(carla, seat.carla[0], seat.carla[1], seat.carla[2], sitPose({ armL: [lerp(0.95, 1.45, k), lerp(0.12, -0.32, k), lerp(0.85, 0.15, k)] }), FACE.happy); put(ze, seat.ze[0], seat.ze[1], seat.ze[2], sitPose(up()), FACE.happy);
  glassInHand(Wd.glasses.hero, hero); glassInHand(Wd.glasses.beto, beto); glassInHand(Wd.glasses.carla, carla, 'L'); glassInHand(Wd.glasses.ze, ze);
  stage.aim([TB[0] + 0.45 + sh, 1.5, TB[1] + 1.05], [TB[0], 1.08, TB[1] - 0.1], lerp(50, 42, ease(u / 2))); });
at(L0(1), (t, u) => { table(t); const sip = clamp((t - (L0(1) + 0.3)) / 1.2); const up = Math.sin(Math.PI * clamp(sip)); heroAtTable(t, { armR: [0.95 + 0.75 * up, 0.15 - 0.45 * up, 0.85 + 1.35 * up], head: [-0.18 * up, 0, 0] }, up > 0.5 ? FACE.bliss : FACE.smile, [0.2, 0]); glassInHand(Wd.glasses.hero, hero, 'R', -0.05);
  faceCam(hero, 0.85, 0.25, -0.05, 38, [0, -0.08, 0]); });
at(w(1, 'operação') - 0.2, (t, u) => { table(t); heroAtTable(t, {}, FACE.happy); const k = ease(clamp(u / 1.4)); faceCam(hero, lerp(0.75, 0.42, k), 0.0, 0.0, 38); });
// ===== 2. o aviso =====
at(B.growl - 0.05, (t, u) => { table(t); heroAtTable(t, { lean: 0.03 * Math.sin(t * 40) * Math.max(0, 1 - u) }, FACE.happy);           // the belly, close: the shirt shakes
  const s = shake(t, 0.006 * Math.max(0, 1 - u * 0.8)); const h = hero.headPos(); stage.aim([h.x + 0.95 + s[0], h.y - 0.38 + s[1], h.z + 0.35], [h.x, h.y - 0.5, h.z + 0.05], 38); });
at(B.growl + 0.75, (t, u) => { table(t); const k = clamp((u - 0.15) / 1.0);                                                              // the smile dies, dolly-zoom
  const f = k < 0.5 ? mixFace(FACE.happy, FACE.smile, k * 2) : mixFace(FACE.smile, FACE.worried, (k - 0.5) * 2); heroAtTable(t, {}, f, [0, 0]);
  const d = lerp(1.35, 0.72, ease(clamp(u / 1.1))), fov = lerp(24, 44, ease(clamp(u / 1.1))); const h = hero.headPos(); stage.aim([h.x, h.y + 0.02, h.z + d], [h.x, h.y - 0.03, h.z], fov); });
// the montage: the clock, adjusting, the clock, crossing the legs, the clock, sweat
const clockShot = (mins) => (t, u) => { table(t); Wd.setClock(mins + u * 0.4); heroAtTable(t, {}, FACE.worried); const s = u < 0.15 ? 0.008 : 0; stage.aim([-0.6 + s, 2.35, -3.2], [-0.6, 2.35, -4], lerp(30, 24, ease(u / 0.6))); };
at(B.m[0], clockShot(12));
at(B.m[0] + 0.55, (t, u) => { table(t); const k = Math.sin(clamp(u / 0.6) * Math.PI); heroAtTable(t, { hipY: 0.03 * k, side: 0.12 * k, twist: 0.1 * k }, mixFace(FACE.worried, FACE.forced, 0.6), [0.6, 0.3], { sweatT: t }); faceCam(hero, 1.5, -0.5, -0.1, 44, [0, -0.25, 0]); });
at(B.m[1], clockShot(13));
at(B.m[1] + 0.5, (t, u) => { table(t); const k = ease(clamp(u / 0.5));                                                                    // under the table: the legs cross, tight
  heroAtTable(t, { legR: [lerp(0, 0.35, k), lerp(0.06, -0.38, k), lerp(0, -0.25, k)], legL: [0, lerp(0.06, -0.05, k), 0] }, FACE.worried);
  stage.aim([seat.hero[0] + 2.2, 0.5, seat.hero[1] - 0.05], [seat.hero[0], 0.45, seat.hero[1] + 0.15], 40); });
at(B.m[2], clockShot(14));
at(B.m[2] + 0.5, (t, u) => { table(t); heroAtTable(t, { legR: [0.35, -0.38, -0.25], legL: [0, -0.05, 0], lean: 0.04 }, FACE.forced, [0, 0], { sweatT: t }); const k = ease(clamp(u / 1.6)); faceCam(hero, lerp(0.7, 0.45, k), 0, 0.02, 38); });
// "Tá tudo bem?": Beto, over the hero's shoulder
at(B.ask - 0.2, (t, u) => { table(t, { mood: 'ask' }); heroAtTable(t, { legR: [0.35, -0.38, -0.25], legL: [0, -0.05, 0] }, FACE.forced, [-1, 0], { sweatT: t });
  const b = beto.headPos(); stage.aim([b.x + 1.05, b.y + 0.08, b.z + 0.45], [b.x, b.y - 0.03, b.z], 36); });
// "Tô só... prestando atenção.": the frozen smile, pushing in
at(B.reply - 0.1, (t, u) => { table(t, { mood: 'ask' }); const twitch = Math.sin(t * 31) > 0.85 ? 0.04 : 0; heroAtTable(t, { legR: [0.35, -0.38, -0.25], legL: [0, -0.05, 0], head: [0, twitch, 0] }, Object.assign({}, FACE.forced, { smile: 1.1 }), [0.9, 0], { sweatT: t });
  const k = ease(clamp(u / 2.2)); faceCam(hero, lerp(0.6, 0.38, k), 0.1, 0.0, 38); });
// "Em um único músculo.": wide, he sits like a statue while the table chats; a slow dramatic zoom
at(B.muscle - 0.1, (t, u) => { table(t); heroAtTable(t, { lean: -0.06, legR: [0.35, -0.38, -0.25], legL: [0, -0.05, 0], armL: [0.3, 0.05, 0.2], armR: [0.3, 0.05, 0.2] }, FACE.determined, [0, 0], { sweatT: t });
  const k = ease(clamp(u / 2.3)); stage.aim([TB[0] + 0.9, lerp(1.85, 1.7, k), TB[1] + lerp(1.5, 1.2, k)], [seat.hero[0], 0.95, seat.hero[1]], lerp(50, 34, k)); });
// ===== 3. a caminhada (the mission) =====
at(B.stand, (t, u) => { table(t); const k = ease(clamp(u / 0.8)); put(hero, seat.hero[0], seat.hero[1] - 0.15 * k, 0, { sit: 1 - k, armL: [0.3, 0.05, 0.1], armR: [0.3, 0.05, 0.1], lean: 0.25 * (1 - k) - 0.05 * k, legL: [0, 0.02, 0], legR: [0, 0.02, 0] }, FACE.determined, [0, 0], 0, { sweatT: t });
  Wd.heroChair.position.z = TB[1] - 0.62 - 0.12 * k; stage.aim([TB[0] + 2.1, 1.3, TB[1] - 1.5], [seat.hero[0], 1.0, seat.hero[1]], 44); });
// tracking alongside: through the bar towards the corridor (path: from the table to the corridor mouth at (3.4, -4))
const path = u => { const a = new THREE.Vector3(TB[0] + 0.3, 0, TB[1] - 0.9), b = new THREE.Vector3(2.2, 0, -2.6), cc = new THREE.Vector3(3.4, 0, -4.3); return u < 0.5 ? a.clone().lerp(b, u * 2) : b.clone().lerp(cc, (u - 0.5) * 2); };
at(B.stand + 1.2, (t, u) => { table(t); const p = path(clamp(u / 4.2 * 0.75)); const ry = Math.atan2(2.2 - TB[0], -2.6 - TB[1]) + Math.PI; stiffWalk(hero, p.x, p.z, Math.atan2(2.8 - TB[0] - 0.3, -3.5 - TB[1] + 0.9), t, FACE.determined, [0.6, 0]);
  const h = hero.headPos(); stage.aim([h.x + 1.9, 1.35, h.z + 0.4], [h.x, 1.05, h.z], 48); stage.camera.rotation.z += 0.08; });
at(B.stand + 2.5, (t, u) => { table(t); const p = path(clamp(0.2 + u / 4.2 * 0.75)); stiffWalk(hero, p.x, p.z, Math.atan2(2.8 - TB[0] - 0.3, -3.5 - TB[1] + 0.9), t, FACE.determined);      // the feet, low: tiny steps
  stage.aim([p.x + 1.0, 0.14, p.z + 0.55], [p.x, 0.22, p.z], 48); });
at(B.stand + 3.7, (t, u) => { table(t); const p = path(clamp(0.38 + u / 4.2 * 0.6)); const k = clamp((u - 0.2) / 0.8);                     // the waiter crosses: he slides sideways, rigid
  stiffWalk(hero, p.x - 0.25 * Math.sin(Math.PI * k), p.z, Math.atan2(2.8 - TB[0] - 0.3, -3.5 - TB[1] + 0.9), t, FACE.panic, [-0.8, 0]);
  const wx = lerp(3.4, 0.9, clamp(u / 1.5)); put(waiter, wx, p.z - 0.55, -Math.PI / 2, { armL: [1.5, 0.3, 1.5], armR: [0.1 * Math.sin(t * 9), 0.1, 0.2], legL: [0.4 * Math.sin(t * 9), 0.03, 0.2], legR: [-0.4 * Math.sin(t * 9), 0.03, 0.2] }, FACE.calm);
  const tp = waiter.handPos('L'); if (!Wd.tray) { Wd.tray = new THREE.Group(); const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.015, 18), new THREE.MeshStandardMaterial({ color: '#c9ccd1', metalness: 0.8, roughness: 0.3 })); Wd.tray.add(tr); Wd.tray.add(Wd.bottle(-0.05, 0.01, 0), Wd.bottle(0.07, 0.01, 0.04)); Wd.sets.bar.add(Wd.tray); }
  Wd.tray.visible = true; Wd.tray.position.set(tp.x, tp.y + 0.06, tp.z);
  const h = hero.headPos(); stage.aim([h.x + 0.1, 1.5, h.z + 1.9], [h.x, 1.15, h.z], 52); stage.camera.rotation.z -= 0.12; });
// the corridor, from its far end: he comes towards us, the bulb flickers
at(B.stand + 5.0, (t, u) => { barScene(t); const z = lerp(-4.6, -7.6, clamp(u / 2.6)); stiffWalk(hero, 3.4, z, Math.PI, t, FACE.determined, [0, 0]); Wd.corBulb.intensity = Math.sin(t * 37) > 0.6 ? 1.0 : 4;
  stage.aim([3.35, 1.55, -10.4], [3.4, 1.1, -5.5], 40); });
// close: determined, sweating, the red HUD heavy
at(B.stand + 6.4, (t, u) => { barScene(t); const z = lerp(-7.4, -8.6, clamp(u / 1.3)); stiffWalk(hero, 3.4, z, Math.PI, t, FACE.determined, [0, 0]); Wd.corBulb.intensity = 4; const s = shake(t, 0.004);
  const h = hero.headPos(); stage.aim([h.x + 0.08 + s[0], h.y + 0.02 + s[1], h.z - 0.55], [h.x, h.y - 0.01, h.z], lerp(40, 34, u)); });
// the door: he turns into it and pushes; the door shuts
at(B.slam - 0.9, (t, u) => { barScene(t); const k = ease(clamp(u / 0.7)); const open = t < B.slam - 0.1 ? 1.2 * ease(clamp((u - 0.2) / 0.4)) : 1.2 * (1 - ease(clamp((t - B.slam + 0.1) / 0.12)));

  stage.aim([3.85, 1.35, -8.5], [2.8, 1.1, -10.0], 46); });
// ===== 4. o alívio =====

// ---------------- the 2D overlay ----------------
function txt(s, x, y, font, fill, o = {}) { c.font = font; c.textAlign = o.align || 'center'; c.textBaseline = 'middle'; if (o.stroke) { c.lineJoin = 'round'; c.lineWidth = o.stroke; c.strokeStyle = o.strokeColor || '#0b0c0f'; c.strokeText(s, x, y); } c.fillStyle = fill; c.fillText(s, x, y); }
function bang(s, k, { x = 540, y = 820, col = '#ffcc4d', size = 200, rot = -0.08 } = {}) { if (k <= 0) return; const sc = clamp(spring(k * 1.3), 0, 1.2); c.save(); c.translate(x, y); c.rotate(rot); c.scale(sc, sc); txt(s, 0, 0, `700 ${size}px Oswald`, col, { stroke: 20 }); c.restore(); }
// the clock card in the montage: big digital time
function clockCard(s, k) { c.save(); c.globalAlpha = clamp(k * 4); c.fillStyle = 'rgba(8,9,12,0.7)'; c.beginPath(); c.roundRect(300, 330, 480, 170, 26); c.fill(); txt(s, 540, 418, '700 120px "JetBrains Mono"', '#ff5a4f'); c.restore(); }
// the mission HUD: a red frame, MISSÃO: BANHEIRO, the distance counting down
function missionHUD(t, dist, done) {
  c.save(); const pulse = 0.5 + 0.5 * Math.sin(t * 9);
  c.strokeStyle = `rgba(255,60,50,${0.35 + 0.25 * pulse})`; c.lineWidth = 10; c.strokeRect(36, 36, 1008, 1848);
  for (const [x, y, sx, sy] of [[60, 60, 1, 1], [1020, 60, -1, 1], [60, 1860, 1, -1], [1020, 1860, -1, -1]]) { c.strokeStyle = '#ff3b30'; c.lineWidth = 12; c.beginPath(); c.moveTo(x, y + sy * 90); c.lineTo(x, y); c.lineTo(x + sx * 90, y); c.stroke(); }
  c.fillStyle = 'rgba(8,9,12,0.72)'; c.beginPath(); c.roundRect(150, 120, 780, 190, 24); c.fill();
  txt('MISSÃO: BANHEIRO', 540, 175, '700 64px Oswald', '#ff5a4f'); txt(done ? 'ALVO ALCANÇADO ✓' : `DISTÂNCIA: ${dist.toFixed(1).replace('.', ',')} m`, 540, 260, '700 48px "JetBrains Mono"', done ? '#4fe08a' : '#f3eee4');
  // scan line
  const y = 330 + ((t * 600) % 1500); c.fillStyle = 'rgba(255,60,50,0.08)'; c.fillRect(40, y, 1000, 40); c.restore();
}
