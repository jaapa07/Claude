<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Motion Reel</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// Type: Motion graphics — "15-second résumé reel of a motion designer" (prompt from @reflex_cloud).
// Beat grid: 120 BPM -> one beat every 0.5 s. Every cut lands on a beat.
const W=1280,H=720,c=document.getElementById('c'),x=c.getContext('2d');
window.DURATION=15;
const BEAT=0.5,PAL=['#ff3b30','#ffcc00','#00e0b8','#4d7cff','#ff5ec8','#f4f1ea'];
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,4), eio=t=>t<0?0:t>1?1:t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function bg(col){x.fillStyle=col;x.fillRect(0,0,W,H)}
function txt(s,px,py,size,col,weight=900,align='center',track=0){x.save();x.font=`${weight} ${size}px "Helvetica Neue",Arial,sans-serif`;x.fillStyle=col;x.textAlign=align;x.textBaseline='middle';if(x.letterSpacing!==undefined)x.letterSpacing=track+'px';x.fillText(s,px,py);x.restore()}
function grain(t){const f=Math.floor(t*30);x.save();x.globalAlpha=.06;for(let i=0;i<900;i++){const r=rnd(i+f*900);x.fillStyle=r>.5?'#fff':'#000';x.fillRect(rnd(i*3+f)*W,rnd(i*7+f*13)*H,2,2)}x.restore()}
function vignette(){const g=x.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.95);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.55)');x.fillStyle=g;x.fillRect(0,0,W,H)}

// 0–1 s: hook. Black, a red block slams in, a word punches through it.
function hook(t){bg('#0a0a0a');const k=ease(t/.35);
  x.save();x.translate(W/2,H/2);x.rotate((1-k)*-.6);x.scale(lerp(3,1,k),lerp(3,1,k));
  x.fillStyle=PAL[0];x.fillRect(-300,-130,600,260);x.restore();
  const s=t<.5?1+.25*Math.sin(t*60)*(.5-t):1;txt('AÇÃO.',W/2,H/2+6,190*s,'#0a0a0a',900,'center',-6);
  if(t>.8){const w=ease((t-.8)/.2);x.fillStyle='#f4f1ea';x.fillRect(0,0,W*w,H)}}

// 1–4.5 s: kinetic typography, one word per beat, alternating layouts.
const WORDS=['LETRAS','QUE','BATEM','NO','TEMPO','CERTO'];
function typo(t){const i=Math.floor(t/BEAT),lt=t-i*BEAT,w=WORDS[i%WORDS.length],k=ease(lt/.18);
  const dark=i%2==1;bg(dark?'#0a0a0a':'#f4f1ea');const fg=dark?'#f4f1ea':'#0a0a0a',acc=PAL[(i+1)%5];
  if(i%3==0){x.save();x.beginPath();x.rect(0,H/2-150,W,300);x.clip();txt(w,W/2,H/2+(1-k)*300,300,fg,900,'center',-10);x.restore()}
  else if(i%3==1){for(let r=0;r<5;r++){const o=(r-2)*120;x.globalAlpha=r==2?1:.18;txt(w,W/2+(r%2?1:-1)*(1-k)*600,H/2+o,120,r==2?acc:fg,900);}x.globalAlpha=1}
  else{x.save();x.translate(W/2,H/2);x.rotate(-.12);x.scale(lerp(.2,1,k),1);x.fillStyle=acc;x.fillRect(-520,-110,1040,220);x.restore();x.save();x.translate(W/2,H/2);x.rotate(-.12);txt(w,0,8,210,fg,900,'center',-6);x.restore()}
  // beat ticker
  for(let b=0;b<WORDS.length;b++){x.fillStyle=b<=i?acc:(dark?'#333':'#ccc');x.fillRect(60+b*28,H-60,20,6)}
  txt('01 / TIPOGRAFIA',W-60,H-56,16,fg,700,'right',3)}

// 4.5–7.5 s: shape play. A grid of shapes morphs circle->square->diamond, waves through.
function shapes(t){bg('#101018');const cols=16,rows=9,s=W/cols;
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const cx=i*s+s/2,cy=j*(H/rows)+H/rows/2;
    const d=Math.hypot(i-cols/2,j-rows/2),ph=t*2.2-d*.18,m=(Math.sin(ph*Math.PI)+1)/2;
    const sz=s*.42*(.35+.65*m),rot=ph*Math.PI/2,round=cl(Math.sin(ph*Math.PI*.5)*.5+.5);
    x.save();x.translate(cx,cy);x.rotate(rot);x.fillStyle=PAL[(i+j+Math.floor(t*2))%5];
    x.beginPath();x.roundRect(-sz,-sz,sz*2,sz*2,sz*round);x.fill();x.restore()}
  const k=ease(t/.4);x.fillStyle='#101018';x.fillRect(W/2-260*k,H/2-70,520*k,140);
  txt('FORMAS',W/2,H/2+4,72*k,'#f4f1ea',900,'center',4);txt('02 / FORMA',W-60,H-56,16,'#f4f1ea',700,'right',3)}

// 7.5–10.5 s: camera move. Fly through a tunnel of rotating rings.
function tunnel(t){bg('#05060a');const spd=t*3.2;
  for(let n=30;n>=0;n--){const z=n-(spd%1),depth=z+Math.floor(spd);if(z<=0.05)continue;
    const sc=380/z,a=cl(1-z/30),col=PAL[((depth%5)+5)%5];
    x.save();x.translate(W/2+Math.sin(t*1.3+z*.2)*80/z*4,H/2+Math.cos(t*1.1+z*.2)*50/z*4);x.rotate(depth*.18+t*.4);
    x.strokeStyle=col;x.globalAlpha=a;x.lineWidth=Math.max(1,10/z*3);
    x.beginPath();const sides=depth%3==0?4:depth%3==1?6:64;for(let s=0;s<=sides;s++){const an=s/sides*Math.PI*2;x.lineTo(Math.cos(an)*sc,Math.sin(an)*sc)}x.stroke();x.restore()}
  x.globalAlpha=1;const k=ease((t-.3)/.4);txt('CÂMERA',W/2,H/2,110*k,'#f4f1ea',900,'center',20);txt('03 / MOVIMENTO',W-60,H-56,16,'#f4f1ea',700,'right',3)}

// 10.5–12.5 s: colour shifts. Diagonal stripe wipes cycling palettes every beat.
function colour(t){const i=Math.floor(t/BEAT),lt=(t-i*BEAT)/BEAT;bg(PAL[(i+4)%5]);
  x.save();x.translate(W/2,H/2);x.rotate(-.5);for(let s=-12;s<12;s++){const p=eio(cl(lt*1.6-(s+12)*.025));x.fillStyle=PAL[(i+5+(s&1?2:0))%5];x.fillRect(s*90,-900,48,1800*p)}x.restore();
  const col=PAL[(i+2)%5];x.fillStyle='#0a0a0a';x.fillRect(W/2-330,H/2-90,660,180);txt('COR',W/2,H/2+6,130,col,900,'center',8);txt('04 / COR',W-60,H-56,16,'#f4f1ea',700,'right',3)}

// 12.5–15 s: the clean final frame.
function outro(t){bg('#f4f1ea');const k=ease(t/.6),k2=ease((t-.35)/.6),k3=ease((t-.8)/.6);
  x.fillStyle=PAL[0];x.beginPath();x.arc(W/2-250,H/2-10,70*k,0,Math.PI*2);x.fill();
  x.save();x.beginPath();x.rect(W/2-170,H/2-90,700,160);x.clip();txt('kinetic',W/2-170,H/2-10+(1-k2)*160,140,'#0a0a0a',900,'left',-4);x.restore();
  x.globalAlpha=k3;txt('MOTION DESIGN  ·  15 SEGUNDOS  ·  ZERO TEMPLATES',W/2,H/2+120,20,'#0a0a0a',700,'center',5);x.globalAlpha=1;
  x.fillStyle='#0a0a0a';x.fillRect(W/2-250,H/2+80,500*k3,3)}

const SCENES=[[0,1,hook],[1,4.5,typo],[4.5,7.5,shapes],[7.5,10.5,tunnel],[10.5,12.5,colour],[12.5,15,outro]];
window.renderFrame=t=>{for(const [a,b,f] of SCENES)if(t>=a&&t<b){f(t-a);break}
  // beat flash on every cut
  for(const [a] of SCENES){const d=t-a;if(d>=0&&d<.08&&a>0){x.fillStyle=`rgba(255,255,255,${.6*(1-d/.08)})`;x.fillRect(0,0,W,H)}}
  vignette();grain(t)};
window.renderFrame(0);
</script></body></html>
