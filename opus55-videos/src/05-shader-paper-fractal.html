<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Paper Fractals</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
#o{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2b1d14;font-family:Georgia,serif;pointer-events:none}
#o h1{margin:0;font-size:84px;font-weight:400;letter-spacing:2px;background:#f2e8d5;padding:6px 34px 12px;box-shadow:6px 8px 0 #0003;transform:rotate(-2deg)}
#o p{margin:18px 0 0;font:700 14px "Helvetica Neue",Arial;letter-spacing:6px;background:#2b1d14;color:#f2e8d5;padding:8px 16px;transform:rotate(1deg)}
#cap{position:fixed;left:44px;bottom:36px;font:700 12px "Helvetica Neue",Arial;letter-spacing:4px;color:#f2e8d5;background:#2b1d14cc;padding:7px 12px}</style></head><body>
<canvas id="c" width="1280" height="720"></canvas><div id="o"><h1>Fractais de Papel</h1><p>RECORTADOS À MÃO · INFINITAMENTE PROFUNDOS</p></div><div id="cap"></div>
<script>
// Type: Generative shader art — a fractal visualiser (Mandelbrot, Julia) that looks hand-made from
// paper and cardboard, with cinematic post-processing and elaborate transitions (prompt from @jrayon).
// One GLSL fragment shader: escape-time bands become stacked paper layers with drop shadows,
// fibre texture, cut-edge highlights; then grade, vignette, grain, light leak, chromatic offset.
const W=1280,H=720;window.DURATION=16;
const gl=document.getElementById('c').getContext('webgl',{preserveDrawingBuffer:true});
const VS=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const FS=`precision highp float;uniform vec2 R;uniform float T,Z,MIX,ROT;uniform vec2 CEN,JC;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*n(p);p*=2.03;a*=.5;}return s;}
const int IT=150;
float mand(vec2 c){vec2 z=vec2(0);for(int i=0;i<IT;i++){z=vec2(z.x*z.x-z.y*z.y,2.*z.x*z.y)+c;float d=dot(z,z);if(d>256.)return float(i)-log2(log2(d))+4.;}return -1.;}
float jul(vec2 z){for(int i=0;i<IT;i++){z=vec2(z.x*z.x-z.y*z.y,2.*z.x*z.y)+JC;float d=dot(z,z);if(d>256.)return float(i)-log2(log2(d))+4.;}return -1.;}
vec2 toC(vec2 fc,bool jm){vec2 uv=(fc-.5*R)/R.y;float c=cos(ROT),s=sin(ROT);uv=mat2(c,-s,s,c)*uv;return jm?uv*2.6:CEN+uv*Z;}
// quantised layer index: higher index = paper closer to the viewer. Inside the set = top layer.
float layer(vec2 fc,bool jm){vec2 c=toC(fc,jm);float it=jm?jul(c):mand(c);if(it<0.)return 9.;float l=floor(sqrt(it)*1.55+fbm(c*(jm?3.:3./Z))*.35);return min(mod(l,9.)+0.,8.);}
vec3 pal(float l,bool jm){
  vec3 a[9];
  if(!jm){a[0]=vec3(.17,.12,.10);a[1]=vec3(.42,.20,.15);a[2]=vec3(.70,.33,.20);a[3]=vec3(.86,.55,.27);a[4]=vec3(.91,.76,.45);a[5]=vec3(.55,.62,.50);a[6]=vec3(.22,.43,.45);a[7]=vec3(.13,.24,.33);a[8]=vec3(.95,.91,.83);}
  else{a[0]=vec3(.08,.10,.16);a[1]=vec3(.14,.20,.33);a[2]=vec3(.22,.36,.52);a[3]=vec3(.42,.58,.66);a[4]=vec3(.72,.78,.74);a[5]=vec3(.93,.83,.66);a[6]=vec3(.90,.58,.47);a[7]=vec3(.66,.30,.35);a[8]=vec3(.97,.93,.86);}
  for(int i=0;i<9;i++)if(float(i)==l)return a[i];return a[8];}
vec3 paper(vec2 fc,bool jm){
  float l=layer(fc,jm);vec2 L=vec2(-1.,1.)*7.;               // light from top-left: shadows fall down-right
  float ls=layer(fc+L,jm),le=layer(fc+vec2(1.2,-1.2),jm);
  vec3 col=pal(l,jm);
  float fib=fbm(fc*vec2(.9,.35)+l*13.)*.10+fbm(fc*.06+l*3.)*.07;col*=.92+fib;   // paper fibre + mottling
  col*=1.-.22*step(l+.5,ls)*clamp((ls-l),0.,3.)/1.5;                           // drop shadow from layer above
  col+=.10*step(le+.5,l);                                                       // lit cut edge
  col*=1.-.04*l*0.;return col;}
void main(){vec2 fc=gl_FragCoord.xy;
  // torn-paper wipe between the two worlds
  float edge=fc.x/R.x+ (fbm(fc*.02)-.5)*.18+ (fc.y/R.y-.5)*.25;float m=smoothstep(1.-edge-.004,1.-edge+.004,MIX);
  vec3 c;if(m<.01)c=paper(fc,false);else if(m>.99)c=paper(fc,true);else c=mix(paper(fc,false),paper(fc,true),m);
  float tear=1.-smoothstep(0.,.012,abs(1.-edge-MIX));c=mix(c,vec3(.97,.94,.88)*(.9+fbm(fc*.3)*.2),tear*step(-.29,MIX)*step(MIX,1.29)*.95);
  // cinematic post: chromatic warm/cool grade, light leak, vignette, grain, flicker
  vec2 uv=fc/R;c=pow(c,vec3(.95));c=mix(c,c*vec3(1.06,1.,.92),.6);
  c+=vec3(1.,.55,.25)*.22*smoothstep(.75,0.,length(uv-vec2(.05+.1*sin(T*.4),.95)))*(.6+.4*sin(T*.9));
  float v=smoothstep(1.15,.35,length((uv-.5)*vec2(1.3,1.)));c*=.55+.45*v;
  c+=(h(fc+fract(T*7.)*100.)-.5)*.06;c*=.985+.015*sin(T*50.);
  gl_FragColor=vec4(c,1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
const U={};['R','T','Z','MIX','ROT','CEN','JC'].forEach(k=>U[k]=gl.getUniformLocation(pr,k));
const ss=t=>t<0?0:t>1?1:t*t*(3-2*t),o=document.getElementById('o'),cap=document.getElementById('cap');
window.renderFrame=t=>{
  // Mandelbrot: zoom into Seahorse Valley; Julia: c orbits the main cardioid boundary.
  const zk=ss(t/10.5),Z=2.4*Math.pow(.0016/2.4,zk*.92+zk*zk*.08);
  const cx=-.5+(-.743643887+.5)*ss(t/3.2),cy=.131825904*ss(t/3.2);
  const MIX=-.3+1.6*ss((t-9.4)/2.2),a=1.9+(t-10)*.12,JC=[.5*Math.cos(a)-.25*Math.cos(2*a)+.012,.5*Math.sin(a)-.25*Math.sin(2*a)];
  gl.uniform2f(U.R,W,H);gl.uniform1f(U.T,t);gl.uniform1f(U.Z,Z);gl.uniform1f(U.MIX,MIX);gl.uniform1f(U.ROT,t*.05);gl.uniform2f(U.CEN,cx,cy);gl.uniform2f(U.JC,JC[0],JC[1]);
  gl.viewport(0,0,W,H);gl.drawArrays(gl.TRIANGLES,0,3);
  const ti=t<2.4?1:1-ss((t-2.4)/.8),te=ss((t-13.6)/.9);o.style.opacity=Math.max(ti,te);o.style.transform=`scale(${1+.04*(1-ti)})`;
  if(t>13.6)o.querySelector('h1').textContent='Dobre. Corte. Repita.',o.querySelector('p').textContent='MANDELBROT → JULIA · UM SÓ SHADER';
  cap.textContent=t<9.6?`MANDELBROT · ZOOM ×${Math.round(2.4/Z)}`:`CONJUNTO DE JULIA · c = ${JC[0].toFixed(3).replace('.',',')} ${JC[1]<0?'−':'+'} ${Math.abs(JC[1]).toFixed(3).replace('.',',')}i`;cap.style.opacity=t>2.8&&t<13.5?1:0};
window.renderFrame(0);
</script></body></html>
