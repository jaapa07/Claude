<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Ferramenta de desenvolvimento: enquadra e renderiza modelos .glb (?m=a.glb,b.glb)
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const q=new URLSearchParams(location.search); const ms=(q.get('m')||'').split(',');
const W=320,H=320; const cols=Math.min(ms.length,4), rows=Math.ceil(ms.length/cols);
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); r.setSize(W*cols,H*rows); r.setScissorTest(true); r.toneMapping=THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const L=new GLTFLoader();
for(let i=0;i<ms.length;i++){
  const g=await L.loadAsync('/public/assets/models/'+ms[i].split('@')[0]); const only=ms[i].split('@')[1]; if(only){const keep=g.scene.children.filter(o=>o.name.startsWith(only)); g.scene.children.slice().forEach(o=>{if(!keep.includes(o))g.scene.remove(o);});}
  const s=new THREE.Scene(); s.background=new THREE.Color(0x9fb4cc);
  s.add(new THREE.HemisphereLight(0xffffff,0x886644,2.2)); const d=new THREE.DirectionalLight(0xffffff,2.5); d.position.set(3,5,4); s.add(d);
  s.add(g.scene);
  const bb=new THREE.Box3().setFromObject(g.scene); const c=bb.getCenter(new THREE.Vector3()); const sz=bb.getSize(new THREE.Vector3()).length();
  const cam=new THREE.PerspectiveCamera(35,W/H,sz/100,sz*10); cam.position.copy(c).add(new THREE.Vector3(0.6,0.5,1).normalize().multiplyScalar(sz*1.4)); cam.lookAt(c);
  const x=(i%cols)*W,y=(rows-1-Math.floor(i/cols))*H; r.setViewport(x,y,W,H); r.setScissor(x,y,W,H); r.render(s,cam);
}
document.title='done';
</script></body></html>
