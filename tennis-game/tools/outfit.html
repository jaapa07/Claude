<!doctype html><html><head><base href="/"></head><body style="margin:0;background:#333"><script type="module">
import * as THREE from 'three';
import { Assets, CORE_ASSETS } from '/src/core/assets.ts';
import { Athlete } from '/src/game/athlete.ts';
import { PLAYERS } from '/src/data/content.ts';
await Assets.loadAll(CORE_ASSETS);
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
const sc = new THREE.Scene(); sc.background = new THREE.Color('#7a8a99');
sc.add(new THREE.HemisphereLight('#fff','#556',1.5)); const d=new THREE.DirectionalLight('#fff',2.5); d.position.set(3,5,4); sc.add(d);
const n = PLAYERS.length;
const cam = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.1, 100);
const zoom = +(q.get('zoom')||1);
cam.position.set(0, 1.2, 14/zoom); cam.lookAt(0, 1.0, 0);
const anim = q.get('anim')||'idle'; const t = +(q.get('t')||0.3);
PLAYERS.forEach((p, i) => {
  const a = new Athlete(p); sc.add(a.root);
  a.root.position.x = (i - (n-1)/2) * 1.1;
  a.root.rotation.y = +(q.get('ry')||0);
  a.play(anim, {fade:0}); a.mixer.update(0); const act=a.actions.get(anim); act.time = t*act.getClip().duration; a.mixer.update(0);
});
r.render(sc, cam); window.done = true;
</script></body></html>
