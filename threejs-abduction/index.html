function addStreak(pos, color, width = 0.9, len = 9, strength = 1, group = 'misc') {
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uColor: { value: new THREE.Color(color) }, uK: { value: strength }, uTime: { value: 0 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform vec3 uColor; uniform float uK, uTime; varying vec2 vUv;
      void main(){ float along = pow(vUv.y, 1.6);
        float across = smoothstep(.5, .0, abs(vUv.x-.5)); across *= across;
        float ripple = .9 + .1*sin(vUv.y*40.0 - uTime*3.0 + vUv.x*9.0);
        float a = along*across*ripple*uK*.55; gl_FragColor = vec4(uColor*a, a); }`
  });
  const s = new THREE.Mesh(streakGeo, m);
  s.position.set(pos.x, 0.03, pos.z);
  s.scale.set(width, 1, len);
  s.userData = { base: strength, group };
  scene.add(s); streaks.push(s);
  return s;
}

  fragmentShader: `uniform float uTime, uFlash; varying vec3 vP;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float a=.5, s=0.; for(int i=0;i<6;i++){ s+=a*n(p); p*=2.03; a*=.5; } return s; }
    void main(){
      float y = max(vP.y, 0.0);
      vec2 uv = vP.xz/(y+.12)*1.4 + vec2(uTime*.02, uTime*.008);
      float c = fbm(uv); float c2 = fbm(uv*2.3 + 7.0);
      vec3 base = mix(vec3(.11,.105,.10), vec3(.07,.07,.075), smoothstep(0.,.6,y));
      vec3 col = base + vec3(.09,.085,.08)*smoothstep(.35,.85,c) - vec3(.03)*c2;
      col += vec3(.55,.58,.7)*uFlash*(.25 + .75*smoothstep(.3,.9,c));
      col = mix(vec3(.115,.11,.105), col, smoothstep(0.0,.18,y));
      gl_FragColor = vec4(col, 1.);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(400, 48, 24), skyMat));

function noiseTex(size, fn) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); const img = g.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const v = fn(x / size, y / size) * 255; const i = (y * size + x) * 4;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const blobs = Array.from({ length: 40 }, () => [rnd(), rnd(), .03 + rnd() * .09]);
const puddleTex = noiseTex(256, (u, v) => {
  let m = 0; for (const [x, y, r] of blobs) {
    for (const ox of [-1, 0, 1]) for (const oy of [-1, 0, 1]) {
      const d = Math.hypot(u - x - ox, v - y - oy); m = Math.max(m, 1 - THREE.MathUtils.smoothstep(d, r * .6, r));
    }
  }
  return 0.55 - m * 0.45 + (rnd() - .5) * .08;
});
function groundMat(color, rough = 1, rep = 6) {
  const t = puddleTex.clone(); t.needsUpdate = true; t.repeat.set(rep, rep);
  return new THREE.MeshStandardMaterial({ color, roughness: rough, roughnessMap: t, metalness: 0.15 });
}

};

}

}

function makeCow() {
  const cow = new THREE.Group();
  const white = std(0xd8d6d0, .8), black = std(0x141414, .8), pink = std(0xc8908f, .7);
  const add = (geo, mat, x, y, z, parent = cow) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; };
  add(new THREE.CapsuleGeometry(.55, 1.2, 6, 12), white, 0, 1.15, 0).rotation.z = Math.PI / 2;
  [[.3, .4, .35], [-.4, .3, -.4], [.1, .55, -.2], [-.2, .2, .5], [-.5, .5, .1]].forEach(([x, y, z]) =>
    add(new THREE.SphereGeometry(.3, 12, 12), black, x, 1.15 + y * .6, z * .9).scale.set(1, .5, 1));
  const head = new THREE.Group(); head.position.set(1.05, 1.5, 0); cow.add(head);
  add(new THREE.BoxGeometry(.6, .5, .5), black, .1, 0, 0, head);
  add(new THREE.BoxGeometry(.25, .35, .52), pink, .45, -.1, 0, head);
  for (const z of [.3, -.3]) add(new THREE.BoxGeometry(.1, .08, .3), black, -.05, .15, z, head);
  const legs = [];
  for (const [x, z] of [[.6, .3], [.6, -.3], [-.6, .3], [-.6, -.3]]) {
    const leg = new THREE.Group(); leg.position.set(x, .9, z); cow.add(leg);
    add(new THREE.CylinderGeometry(.1, .09, .85, 8), white, 0, -.42, 0, leg); legs.push(leg);
  }
  cow.userData = { legs, head };
  return cow;
}

    void main(){ vUv=uv; vec4 mv=modelViewMatrix*vec4(position,1.); vN=normalize(normalMatrix*normal); vV=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,

    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9,78.2)))*43758.5); }
    void main(){
      float facing = abs(dot(vN, vV));
      float core = pow(facing, 1.5);
      float swirl = .6 + .4*sin(vUv.x*31.4 + vUv.y*6. - uTime*2.0) * sin(vUv.y*14. + uTime*4.0);
      float mist = .7 + .3*h(floor(vec2(vUv.x*60., vUv.y*40. - uTime*20.)));
      float fade = smoothstep(0.,.08,vUv.y) * mix(.55, 1., vUv.y);
      float a = (.08 + core*.55) * swirl * mist * fade * uPower;
      gl_FragColor = vec4(vec3(.86,.9,1.)*a*1.5, a);
    }`
});
const beamGeo = new THREE.CylinderGeometry(1.6, 3.2, beamH, 48, 24, true).translate(0, -beamH / 2, 0);
const beam = new THREE.Mesh(beamGeo, beamMat); scene.add(beam);
const hitStreak = addStreak({ x: COW_HOME.x, z: COW_HOME.z }, 0xdfe8ff, 5, 10, 0, 'beam');

// light trails behind the saucer when it moves fast
const TRAIL_N = 36, trailAngles = [0, 1.3, 2.6, 3.9, 5.2];
const trails = trailAngles.map(() => {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_N * 3), 3));
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(TRAIL_N * 3), 3));
  const l = new THREE.Line(g, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  l.frustumCulled = false; scene.add(l); return { line: l, hist: [] };
});

// ---------------- rain ----------------
const RAIN = 7000;
const rainGeo = new THREE.BufferGeometry();
{
  const pos = new Float32Array(RAIN * 6), seed = new Float32Array(RAIN * 6), tip = new Float32Array(RAIN * 2);
  for (let i = 0; i < RAIN; i++) {
    const s = [rnd(), rnd(), rnd()];
    seed.set(s, i * 6); seed.set(s, i * 6 + 3); tip[i * 2] = 0; tip[i * 2 + 1] = 1;
  }
  rainGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  rainGeo.setAttribute('seed', new THREE.BufferAttribute(seed, 3));
  rainGeo.setAttribute('tip', new THREE.BufferAttribute(tip, 1));
}
const rainMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { uTime: { value: 0 }, uCam: { value: new THREE.Vector3() }, uFlash: { value: 0 } },
  vertexShader: `attribute vec3 seed; attribute float tip; uniform float uTime; uniform vec3 uCam; varying float vA;
    void main(){
      vec3 B = vec3(36., 22., 36.);
      vec3 vel = vec3(2.5, -24., 1.2) * (.85 + .3*fract(seed.x*37.1));
      vec3 p = seed*B + vel*uTime;
      p = mod(p - uCam + B*.5, B) - B*.5 + uCam;
      p += normalize(vel) * .5 * tip;
      vA = tip;
      gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.);
    }`,
  fragmentShader: `uniform float uFlash; varying float vA; void main(){ float a = .12*vA + uFlash*.25*vA; gl_FragColor = vec4(vec3(.8,.82,.85), a); }`
});
const rain = new THREE.LineSegments(rainGeo, rainMat); rain.frustumCulled = false; scene.add(rain);

// ---------------- lightning ----------------
const boltMat = new THREE.LineBasicMaterial({ color: 0xe8eeff, transparent: true, blending: THREE.AdditiveBlending });
const bolt = new THREE.Line(new THREE.BufferGeometry(), boltMat); bolt.visible = false; bolt.frustumCulled = false; scene.add(bolt);
let flash = 0, nextStrike = 5;
let audio = null, muted = false;
function strike(now) {
  const a = -0.6 + Math.random() * 2.2, r = 180;
  const p = new THREE.Vector3(Math.sin(a) * r, 90, Math.cos(a) * r);
  const pts = [p.clone()];
  while (p.y > 8) { p.y -= 4 + Math.random() * 6; p.x += (Math.random() - .5) * 10; p.z += (Math.random() - .5) * 10; pts.push(p.clone()); }
  bolt.geometry.dispose(); bolt.geometry = new THREE.BufferGeometry().setFromPoints(pts);
  flash = 1; nextStrike = now + 6 + Math.random() * 9;
  if (audio) audio.thunder(0.6 + Math.random() * 1.8);
}

// ---------------- post: bloom + bodycam lens ----------------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .75, .55, .55));
const lens = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uAspect: { value: innerWidth / innerHeight }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime, uAspect; uniform vec2 uRes; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
    vec2 warp(vec2 uv, float k){ vec2 c = uv-.5; c.x*=uAspect; float r2=dot(c,c); c *= (1.+k*r2)/(1.+k*.3); c.x/=uAspect; return c+.5; }
    void main(){
      float k = .26;
      vec2 uR = warp(vUv, k*1.03), uG = warp(vUv, k), uB = warp(vUv, k*.97);
      vec3 col = vec3(texture2D(tDiffuse,uR).r, texture2D(tDiffuse,uG).g, texture2D(tDiffuse,uB).b);
      if (uG.x<0.||uG.x>1.||uG.y<0.||uG.y>1.) col = vec3(0.);
      float l = dot(col, vec3(.299,.587,.114));
      col = mix(vec3(l), col, .62);
      col = (col - .5) * 1.08 + .5;
      col = col * vec3(1.02, 1.0, .95) + vec3(.022, .02, .018);
      col += (h(vUv*uRes + fract(uTime*7.)) - .5) * .085;
      col *= .96 + .04*sin(vUv.y*uRes.y*1.6);
      vec2 c = vUv-.5; c.x*=uAspect;
      col *= smoothstep(1.02, .38, length(c));
      gl_FragColor = vec4(max(col, 0.), 1.);
    }`
});
composer.addPass(lens);
composer.addPass(new OutputPass());

// ---------------- audio ----------------
function makeAudio() {
  const ctx = new AudioContext();
  const master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination);
  const nb = ctx.createBuffer(1, ctx.sampleRate * 3, ctx.sampleRate);
  const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const noise = () => { const s = ctx.createBufferSource(); s.buffer = nb; s.loop = true; s.start(); return s; };
  { const s = noise(), hp = ctx.createBiquadFilter(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
    hp.type = 'highpass'; hp.frequency.value = 500; lp.type = 'lowpass'; lp.frequency.value = 7000; g.gain.value = .16;
    s.connect(hp); hp.connect(lp); lp.connect(g); g.connect(master); }
  { const s = noise(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 180; g.gain.value = .22; s.connect(lp); lp.connect(g); g.connect(master); }
  const humGain = ctx.createGain(); humGain.gain.value = 0;
  const humLP = ctx.createBiquadFilter(); humLP.type = 'lowpass'; humLP.frequency.value = 500; humLP.connect(humGain); humGain.connect(master);
  const hums = [48, 48.6, 96.4, 144].map((f, i) => { const o = ctx.createOscillator(); o.type = i < 2 ? 'sawtooth' : 'sine'; o.frequency.value = f;
    const g = ctx.createGain(); g.gain.value = i < 2 ? .18 : .1; o.connect(g); g.connect(humLP); o.start(); return o; });
  const lfo = ctx.createOscillator(), lfoG = ctx.createGain(); lfo.frequency.value = .4; lfoG.gain.value = 220; lfo.connect(lfoG); lfoG.connect(humLP.frequency); lfo.start();
  const sh = ctx.createOscillator(), shG = ctx.createGain(); sh.frequency.value = 900; shG.gain.value = 0; sh.connect(shG); shG.connect(master); sh.start();
  function thunder(delay) {
    const t = ctx.currentTime + delay, s = ctx.createBufferSource(); s.buffer = nb;
    const lp = ctx.createBiquadFilter(), g = ctx.createGain(); lp.type = 'lowpass'; lp.frequency.value = 220;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(1.3, t + .08); g.gain.exponentialRampToValueAtTime(.4, t + .6);
    g.gain.exponentialRampToValueAtTime(.001, t + 4.5);
    s.connect(lp); lp.connect(g); g.connect(master); s.start(t); s.stop(t + 5);
  }
  return { ctx, master, humGain, hums, sh, shG, thunder };
}
const sndBtn = document.getElementById('snd');
sndBtn.onclick = () => {
  if (!audio) return;
  muted = !muted; audio.master.gain.value = muted ? 0 : .9; sndBtn.textContent = muted ? '🔇 Mudo' : '🔊 Som';
};

// ---------------- camera path (bodycam walk) ----------------
const LOOP = 50;
const K = [ // [time, position, look-at]
  [0,  [-26, 1.7, 19], [-4, 2.2, -3]],
  [7,  [-19, 1.7, 12], [-6, 2, -3]],
  [14, [-12, 1.7, 7], [-9, 1.8, -3]],
  [19, [-4, 1.7, 3.5], [4, 1.5, 2]],
  [24, [3, 1.7, 1.2], [8, 1.5, 6]],
  [28, [6.5, 1.7, 7.5], [7, 2.4, 30]],
  [32, [6.6, 1.65, 8.6], [6, 3, 30]],
  [42, [6.8, 1.65, 9.2], [8, 4, 30]],
  [46, [6, 1.7, 9.8], [-4, 2.2, -1]],
  [50, [-6, 1.7, 15], [-10, 2, -3]],
];
const posCurve = new THREE.CatmullRomCurve3(K.map(k => new THREE.Vector3(...k[1])), false, 'centripetal');
const lookCurve = new THREE.CatmullRomCurve3(K.map(k => new THREE.Vector3(...k[2])), false, 'centripetal');
function pathU(t) {
  for (let i = 0; i < K.length - 1; i++) if (t <= K[i + 1][0]) {
    const f = (t - K[i][0]) / (K[i + 1][0] - K[i][0]);
    return (i + f * f * (3 - 2 * f) * .35 + f * .65) / (K.length - 1);
  }
  return 1;
}

// ---------------- timeline ----------------
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const seg = (t, a, b) => THREE.MathUtils.clamp((t - a) / (b - a), 0, 1);
const UFO_FROM = new THREE.Vector3(-90, 45, 90), UFO_HOVER = new THREE.Vector3(COW_HOME.x, 14, COW_HOME.z), UFO_TO = new THREE.Vector3(160, 80, 40);

let started = false, t0 = 0, walkPhase = 0;
const lastCam = new THREE.Vector3();
const mouse = { x: 0, y: 0, sx: 0, sy: 0 };
addEventListener('pointermove', e => { mouse.x = e.clientX / innerWidth - .5; mouse.y = e.clientY / innerHeight - .5; });
const startEl = document.getElementById('start');
function begin() {
  startEl.remove();
  if (!audio) { try { audio = makeAudio(); } catch (e) { audio = null; } }
  started = true; t0 = performance.now();
}
startEl.onclick = begin;
document.getElementById('replay').onclick = () => { if (!started) begin(); t0 = performance.now(); };
if (params.has('autostart') || !isNaN(FREEZE)) { startEl.remove(); started = true; t0 = performance.now(); }

const clockEl = document.getElementById('clock'), recEl = document.getElementById('recdot'), audEl = document.getElementById('aud');
const BASE = new Date(2026, 10, 24, 23, 14, 7).getTime();
const pad = n => String(n).padStart(2, '0');
const tmp = new THREE.Vector3(), look = new THREE.Vector3(), ufoPrev = new THREE.Vector3();
let lastNow = performance.now();

function animate() {
  const nowMs = performance.now();
  const dt = Math.min((nowMs - lastNow) / 1000, .1); lastNow = nowMs;
  const time = nowMs / 1000;
  const t = !isNaN(FREEZE) ? FREEZE : started ? ((nowMs - t0) / 1000) % LOOP : 0;

  // --- UFO ---
  const arrive = seg(t, 27, 31), leave = seg(t, 40.5, 43);
  ufoPrev.copy(ufo.position);
  ufo.visible = t >= 27 && t <= 43;
  if (!ufo.visible) ufo.position.copy(UFO_FROM);
  else if (leave > 0) ufo.position.lerpVectors(UFO_HOVER, UFO_TO, Math.pow(leave, 2.4));
  else {
    const a = ease(arrive);
    ufo.position.lerpVectors(UFO_FROM, UFO_HOVER, a);
    ufo.position.y += Math.sin(a * Math.PI) * 6 + Math.sin(time * 1.4) * .25 * a;
  }
  ufo.rotation.y = time * .8;
  ufo.rotation.z = (1 - arrive) * .35 - leave * .4 + Math.sin(time * .9) * .03;
  rimLights.forEach((b, i) => b.material.color.setScalar(.35 + .65 * ((Math.sin(time * 7 - i * .8) + 1) * .5)));
  const speed = !isNaN(FREEZE) ? (arrive > 0 && arrive < 1 || leave > 0 ? 40 : 0) : ufo.position.distanceTo(ufoPrev) / Math.max(dt, 1e-3);
  trails.forEach((tr, k) => {
    const a = trailAngles[k];
    tr.hist.unshift(tmp.set(Math.cos(a) * 3.6, -.2, Math.sin(a) * 3.6).add(ufo.position).clone());
    if (tr.hist.length > TRAIL_N) tr.hist.pop();
    const pa = tr.line.geometry.attributes.position, ca = tr.line.geometry.attributes.color;
    const vis = ufo.visible ? THREE.MathUtils.clamp((speed - 6) / 25, 0, 1) : 0;
    for (let i = 0; i < TRAIL_N; i++) {
      const p = tr.hist[Math.min(i, tr.hist.length - 1)]; pa.setXYZ(i, p.x, p.y, p.z);
      const f = (1 - i / TRAIL_N) * vis; ca.setXYZ(i, .75 * f, .85 * f, f);
    }
    pa.needsUpdate = ca.needsUpdate = true;
  });

  // --- beam & cow ---
  const pw = seg(t, 31.5, 33) * (1 - seg(t, 39.5, 40.5));
  beam.visible = pw > .001;
  beamMat.uniforms.uTime.value = time; beamMat.uniforms.uPower.value = pw * (.92 + Math.random() * .08);
  beam.position.copy(ufo.position); beam.position.y -= .95;
  beam.scale.set(1, Math.max(.01, (ufo.position.y - .95) / beamH), 1);
  beamLight.position.copy(ufo.position); beamLight.position.y -= 1;
  beamLight.target.position.set(ufo.position.x, 0, ufo.position.z);
  beamLight.intensity = 260 * pw;
  hitStreak.material.uniforms.uK.value = pw * 1.2;
  hitStreak.position.set(ufo.position.x, .03, ufo.position.z);
  coreDisc.material.color.setScalar(.6 + .4 * pw);

  const rise = ease(seg(t, 33.5, 40));
  const absorb = seg(t, 39.6, 40.3);
  if (t < 27 || t > 43) {
    cow.visible = t < 27; cow.position.copy(COW_HOME); cow.rotation.set(0, .6, 0); cow.scale.setScalar(1);
  } else {
    cow.visible = absorb < 1;
    cow.position.set(COW_HOME.x + Math.sin(time * 1.3) * .2 * rise, rise * 11.6, COW_HOME.z);
    cow.rotation.set(Math.sin(time * .7) * .6 * rise, .6 + time * .6 * rise, Math.sin(time) * .5 * rise);
    cow.scale.setScalar(Math.max(1e-4, 1 - absorb));
  }
  cow.userData.legs.forEach((l, i) => l.rotation.z = Math.sin(time * 10 + i) * .7 * rise);
  cow.userData.head.rotation.z = rise > 0 ? Math.sin(time * 4) * .3 : -.45 + Math.sin(time * .8) * .08;

  // --- lights flicker while the craft is near ---
  const near = ufo.visible ? THREE.MathUtils.clamp(1 - ufo.position.distanceTo(UFO_HOVER) / 60, 0, 1) : 0;
  const flick = near > .05 && Math.random() < near * .35 ? .15 : 1;
  streetLights.forEach(l => l.intensity = 40 * flick);
  canopyLights.forEach(l => l.intensity = 22 * (near > .5 && Math.random() < .12 ? .3 : 1));
  headMat.color.setScalar(flick);

  // --- lightning ---
  if (time > nextStrike) strike(time);
  flash *= Math.pow(.02, dt);
  const fl = flash * (.6 + .4 * Math.sin(time * 60));
  skyMat.uniforms.uFlash.value = fl; skyMat.uniforms.uTime.value = time;
  flashLight.intensity = fl * 3; hemi.intensity = .35 + fl * .6;
  bolt.visible = flash > .35; boltMat.opacity = flash;
  rainMat.uniforms.uFlash.value = fl;

  // --- camera (bodycam) ---
  const u = pathU(t);
  posCurve.getPoint(u, camera.position);
  lookCurve.getPoint(u, look);
  const wUfo = ufo.visible ? seg(t, 27.5, 29.5) * (1 - seg(t, 42.5, 44.5)) : 0;
  if (wUfo > 0) {
    tmp.copy(ufo.position); if (pw > 0) tmp.lerp(cow.position, .45 * pw * (1 - rise * .6));
    look.lerp(tmp, wUfo * .92);
  }
  const moved = camera.position.distanceTo(lastCam); lastCam.copy(camera.position);
  const walking = THREE.MathUtils.clamp(moved / Math.max(dt, 1e-3) / 1.2, 0, 1);
  walkPhase += dt * 7.5 * walking;
  camera.position.y += Math.abs(Math.sin(walkPhase)) * .07 * walking - .035 * walking;
  camera.position.x += Math.sin(walkPhase * .5) * .03 * walking;
  camera.lookAt(look);
  mouse.sx += (mouse.x - mouse.sx) * .05; mouse.sy += (mouse.y - mouse.sy) * .05;
  const shake = (Math.sin(time * 1.7) + Math.sin(time * 2.9 + 1) * .6 + Math.sin(time * 5.3) * .25) * .006;
  camera.rotateY(-mouse.sx * .7 + shake);
  camera.rotateX(-mouse.sy * .4 + Math.sin(time * 2.3) * .005 + Math.sin(walkPhase * 2) * .006 * walking);
  camera.rotateZ(Math.sin(walkPhase) * .012 * walking + Math.sin(time * .9) * .006);
  rainMat.uniforms.uCam.value.copy(camera.position); rainMat.uniforms.uTime.value = time % 1000;

  for (const s of streaks) {
    const dx = camera.position.x - s.position.x, dz = camera.position.z - s.position.z;
    s.rotation.y = Math.atan2(dx, dz);
    s.material.uniforms.uTime.value = time % 1000;
    if (s.userData.group === 'street') s.material.uniforms.uK.value = s.userData.base * flick;
  }

  // --- audio ---
  if (audio && !muted) {
    const now = audio.ctx.currentTime;
    const prox = ufo.visible ? THREE.MathUtils.clamp(1 - ufo.position.distanceTo(camera.position) / 90, 0, 1) : 0;
    audio.humGain.gain.setTargetAtTime(.5 * prox * prox + .15 * pw, now, .15);
    audio.shG.gain.setTargetAtTime(.03 * pw, now, .2);
    audio.sh.frequency.setTargetAtTime(700 + rise * 600, now, .3);
    audio.hums[0].frequency.setTargetAtTime(48 + leave * 140, now, .1);
    audio.hums[1].frequency.setTargetAtTime(48.6 + leave * 143, now, .1);
  }

  // --- HUD ---
  const dd = new Date(BASE + (started ? t * 1000 : 0));
  clockEl.textContent = `${dd.getFullYear()}-${pad(dd.getMonth() + 1)}-${pad(dd.getDate())} ${pad(dd.getHours())}:${pad(dd.getMinutes())}:${pad(dd.getSeconds())}`;
  recEl.style.visibility = Math.floor(time * 1.5) % 2 ? 'hidden' : 'visible';
  const lvl = Math.min(5, 1 + Math.round(Math.random() * 1.2 + flash * 3 + (ufo.visible ? 2 : 0)));
  audEl.textContent = '▮'.repeat(lvl) + '▯'.repeat(5 - lvl);

  lens.uniforms.uTime.value = time % 1000;
  composer.render();
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  lens.uniforms.uAspect.value = innerWidth / innerHeight; lens.uniforms.uRes.value.set(innerWidth, innerHeight);
});
</script>
</body>
